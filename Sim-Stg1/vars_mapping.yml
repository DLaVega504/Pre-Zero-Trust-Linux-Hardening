---
distro_blueprint:
  # =========================================================================
  # ARCH LINUX BLUEPRINT CONFIGURATION PROFILE (LYNIS 81 Posture Foundation)
  # =========================================================================
  arch_vars:
    # Explicit multi-kernel baseline + compilation tooling headers
    bootstrap_packages: "base linux linux-headers linux-hardened linux-headers-hardened linux-firmware intel-ucode amd-ucode"
    subvolumes:
      - { name: "@", dest: "/" }
      - { name: "@home", dest: "/home" }
      - { name: "@root", dest: "/root" }
      - { name: "@srv", dest: "/srv" }
      - { name: "@var_log", dest: "/var/log" }
      - { name: "@var_cache", dest: "/var/cache" }
      - { name: "@var_tmp", dest: "/var/tmp" }
      - { name: "@var_spool", dest: "/var/spool" }
      - { name: "@var_lib_docker", dest: "/var/lib/docker" }
      - { name: "@var_lib_machines", dest: "/var/lib/machines" }
      - { name: "@usr_local", dest: "/usr/local" }
      - { name: "@opt", dest: "/opt" }
      - { name: "@swap", dest: "/swap" }
      - { name: ".snapshots", dest: "/.snapshots" }

  # =========================================================================
  # DEBIAN LINUX BLUEPRINT CONFIGURATION PROFILE (LYNIS 90 Posture Foundation)
  # =========================================================================
  debian_vars:
    bootstrap_packages: "linux-image-amd64 linux-headers-amd64 locales"
    subvolumes:
      - { name: "@rootfs", dest: "/" }
      - { name: "@home", dest: "/home" }
      - { name: "@root", dest: "/root" }
      - { name: "@srv", dest: "/srv" }
      - { name: "@var_log", dest: "/var/log" }
      - { name: "@var_cache", dest: "/var/cache" }
      - { name: "@var_tmp", dest: "/var/tmp" }
      - { name: "@var_spool", dest: "/var/spool" }
      - { name: "@var_lib", dest: "/var/lib" }
      - { name: "@usr_local", dest: "/usr/local" }
      - { name: "@opt", dest: "/opt" }
      - { name: "swap", dest: "/swap" }
      - { name: ".snapshots", dest: "/.snapshots" }

  # =========================================================================
  # FEDORA LINUX BLUEPRINT CONFIGURATION PROFILE (REDHAT CORE)
  # =========================================================================
  fedora_vars:
    bootstrap_packages: "kernel kernel-core kernel-devel kernel-headers fedora-release"
    subvolumes:
      - { name: "root", dest: "/" }
      - { name: "home", dest: "/home" }
      - { name: "root_user", dest: "/root" }
      - { name: "var_log", dest: "/var/log" }
      - { name: "var_cache", dest: "/var/cache" }
      - { name: "var_tmp", dest: "/var/tmp" }
      - { name: "usr_local", dest: "/usr/local" }
      - { name: "opt", dest: "/opt" }
      - { name: "swap", dest: "/swap" }
      - { name: ".snapshots", dest: "/.snapshots" }

  # =========================================================================
  # OPENSUSE TUMBLEWEED PROFILE (LYNIS 95 NESTED SNAPSHOT MOUNT POSTURE)
  # =========================================================================
  suse_vars:
    bootstrap_packages: "kernel-default kernel-default-devel openSUSE-release"
    subvolumes:
      # Enforces strict compatibility with openSUSE's transactional root model
      - { name: "@", dest: "/" }
      - { name: "@home", dest: "/home" }
      - { name: "@root", dest: "/root" }
      - { name: "@srv", dest: "/srv" }
      - { name: "@var", dest: "/var" }
      - { name: "@usr_local", dest: "/usr/local" }
      - { name: "@opt", dest: "/opt" }
      - { name: "swap", dest: "/swap" }
      - { name: ".snapshots", dest: "/.snapshots" }

