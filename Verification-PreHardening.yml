---
- name: "Standalone Operational Verification Substrate Loop (Stage 1)"
  hosts: "localhost"
  connection: "local"
  become: true
  gather_facts: true

  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    staging_root: "/mnt/target"

  tasks:
    # =========================================================================
    # PHASE 1: PHYSICAL STORAGE MAP AUDITING
    # =========================================================================
    - name: "AUDIT | Verify primary cryptographic root mapper channel is active"
      ansible.builtin.command: "test -e /dev/mapper/{{ os_crypt_name }}"
      register: crypt_root_check
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate primary block volume descriptor integrity"
      ansible.builtin.assert:
        that:
          - "crypt_root_check.rc == 0"
        msg: "CRITICAL FAILURE: The secure container mapper channel '{{ os_crypt_name }}' is not initialized!"
      when: "not ansible_check_mode"

    - name: "AUDIT | Check active staging directory root mount characteristics"
      ansible.builtin.command: "mountpoint -q {{ staging_root }}"
      register: mount_status
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate installation staging target presence"
      ansible.builtin.assert:
        that:
          - "mount_status.rc == 0"
        msg: "CRITICAL FAILURE: The base operating system target substrate directory is not mounted at {{ staging_root }}!"
      when: "not ansible_check_mode"

    # =========================================================================
    # PHASE 2: BTRFS SUBVOLUME TREE STRUCTURE INSPECTION
    # =========================================================================
    - name: "AUDIT | Verify all core subvolume paths are structurally active"
      ansible.builtin.command: "mountpoint -q {{ staging_root }}{{ item }}"
      loop: [ '/home', '/var/log', '/swap', '/var/lib/portables', '/var/lib/machines', '/.snapshots', '/home/.snapshots', '/srv' ]
      register: subvol_mount_status
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate target isolated subvolume room topology"
      ansible.builtin.assert:
        that:
          - "item.rc == 0"
        msg: "CRITICAL FAILURE: Required distribution subvolume node layout path '{{ item.item }}' is missing or unmounted!"
      loop: "{{ subvol_mount_status.results }}"
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 3: COW-EXEMPT SWAP & CRYPTOGRAPHIC KEY METRICS
    # =========================================================================
    - name: "AUDIT | Inspect layout parameters of the allocated system swap file"
      ansible.builtin.stat:
        path: "{{ staging_root }}/swap/swapfile"
      register: swapfile_status
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate physical swapfile presence and security bounds"
      ansible.builtin.assert:
        that:
          - "swapfile_status.stat.exists | bool"
          - "swapfile_status.stat.mode == '0600'"
        msg: "CRITICAL FAILURE: System swapfile is missing or has insecure root permissions!"
      when: "not ansible_check_mode"

    - name: "AUDIT | Verify Copy-on-Write (CoW) exemption flag status on swap file"
      ansible.builtin.command: "lsattr {{ staging_root }}/swap/swapfile"
      register: swap_attr_check
      changed_when: false
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate absolute Btrfs CoW exemption state"
      ansible.builtin.assert:
        that:
          - "'C' in swap_attr_check.stdout"
        msg: "CRITICAL FAILURE: Swap file is missing the mandatory Copy-on-Write (+C) exemption attribute flag!"
      when: "not ansible_check_mode"

    - name: "AUDIT | Verify random 32-byte secure vault hardware unlock token presence"
      ansible.builtin.stat:
        path: "{{ staging_root }}/etc/secure/vault.key"
      register: vault_key_status
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate detached system vault keyfile permission matrices"
      ansible.builtin.assert:
        that:
          - "vault_key_status.stat.exists | bool"
          - "vault_key_status.stat.mode == '0400'"
        msg: "CRITICAL FAILURE: High-security detached vault key mapping is missing or lacks strict Mode 0400 constraints!"
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 4: LEDGER INTEGRITY CHECKS (/etc/fstab & /etc/crypttab)
    # =========================================================================
    - name: "AUDIT | Parse configuration fstab mount table for device references"
      ansible.builtin.command: "grep -q '/dev/mapper/{{ os_crypt_name }}' {{ staging_root }}/etc/fstab"
      register: fstab_crypt_check
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "AUDIT | Parse configuration fstab mount table for isolated swap maps"
      ansible.builtin.command: "grep -q '/swap/swapfile' {{ staging_root }}/etc/fstab"
      register: fstab_swap_check
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "AUDIT | Parse target crypttab encryption ledger maps for core container routing paths"
      ansible.builtin.command: "grep -q '{{ os_crypt_name }} UUID=' {{ staging_root }}/etc/crypttab"
      register: crypttab_core_check
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "ENFORCE | Validate static configuration tables filesystem records"
      ansible.builtin.assert:
        that:
          - "fstab_crypt_check.rc == 0"
          - "fstab_swap_check.rc == 0"
          - "crypttab_core_check.rc == 0"
        msg: "CRITICAL FAILURE: Target filesystem configuration ledger matrices (/etc/fstab or /etc/crypttab) are broken or invalid!"
      when: "not ansible_check_mode"

    # =========================================================================
    # SYSTEM CONSOLE RECAP DIAGNOSTICS CARD
    # =========================================================================
    - name: "LOGGING | Output absolute system framework validation success matrix"
      ansible.builtin.debug:
        msg:
          - "==========================================================================="
          - "                       STAGE 1 VERIFICATION SUCCESS                        "
          - "==========================================================================="
          - "[✔] Master storage decryption container: ACTIVE (/dev/mapper/{{ os_crypt_name }})"
          - "[✔] Target workspace mount context: STABLE ({{ staging_root }})"
          - "[✔] Subvolume tree structure rooms: VERIFIED MOUNTED (13-Node Topology Active)"
          - "[✔] Solid Btrfs Swap Allocation: ACTIVE (Mode 0600, +C Copy-on-Write Exempt)"
          - "[✔] Detached Vault Cryptographic Key: ARMED AND SECURED (Mode 0400 /etc/secure/)"
          - "[✔] System configuration ledgers: VALIDATED AND COMPILED (fstab & crypttab Sync)"
          - "STATUS: Operational substrate frame is completely sound. Safe to issue reboot sequence."

