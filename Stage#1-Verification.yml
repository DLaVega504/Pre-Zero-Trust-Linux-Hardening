---
- name: "Universal Interactive Turn-Key Linux Pre-Hardening Framework (Stage 1)"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false # SAFE: Set to false initially to allow raw dependency hydration pass
  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    swap_mount_opts: "noatime,space_cache=v2,nodatacow"
    
    # Programmatic choice variable assignments via prompts
    vault_size_input: "{{ vault_size_prompt.user_input | default(vault_max_suggested, true) | int }}"
    os_passphrase: "{{ os_pass_prompt.user_input | default('', true) }}"
    vault_passphrase: "{{ vault_pass_prompt.user_input | default('', true) }}"
    vault_root_password: "{{ root_pass_prompt.user_input | default('', true) }}"
    target_username: "{{ user_prompt.user_input | default('vega', true) }}"
    vault_user_password: "{{ user_pass_prompt.user_input | default('', true) }}"
    target_hostname: "{{ hostname_prompt.user_input | default('fortress-node', true) }}"

  tasks:
    # =========================================================================
    # PRE-FLIGHT LIVE NODE ENVIRONMENT HYDRATION ENGINE
    # =========================================================================
    - name: "PRE-FLIGHT | Automatically provision runtime dependencies and collections on target host"
      ansible.builtin.raw: |
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip gptfdisk ansible
        fi
        ansible-galaxy collection install ansible.posix --force-with-deps || true
      changed_when: false
      failed_when: false

    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup:
      become: false
    # =========================================================================
    # PHASE 1 | AUTOMATED HARDWARE, METADATA & RECONNAISSANCE SCANNING ENGINE
    # =========================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.command: "test -d /sys/firmware/efi"
      register: efi_directory_check
      failed_when: false
      changed_when: false
      check_mode: false
      become: false # SAFE: Stops nested sudo prompt traps completely on dry runs

    - name: "SCAN | Detect unmounted target storage device blocks"
      ansible.builtin.shell: |
        lsblk -dnro NAME,TYPE | awk '$2=="disk" {print "/dev/"$1}' | head -n 1
      register: auto_disk_discovery
      changed_when: false
      check_mode: false
      become: false

    - name: "SCAN | Detect drive media rotation profiles (HDD vs SSD/Virtual)"
      ansible.builtin.shell: |
        DEV_NAME=$(basename "{{ auto_disk_discovery.stdout | default('sda') }}")
        if [ -f "/sys/block/$DEV_NAME/queue/rotational" ]; then
          if [ "$(cat /sys/block/$DEV_NAME/queue/rotational)" = "0" ]; then
            echo "SSD/VIRTUAL"
          else
            echo "MECHANICAL_HDD"
          fi
        else
          echo "UNKNOWN"
        fi
      register: auto_media_type
      changed_when: false
      check_mode: false
      become: false

    - name: "SCAN | Discover active network card interface node names"
      ansible.builtin.shell: |
        ip -br link show | awk '$1 !~ /lo|virbr|docker/ {print $1}' | paste -sd "," -
      register: auto_network_discovery
      changed_when: false
      check_mode: false
      become: false

    - name: "SCAN | Interrogate raw CPU parameters to find mobile indicators safely"
      ansible.builtin.shell: |
        grep -m1 "model name" /proc/cpuinfo | cut -d: -f2
      register: local_host_cpu_probe
      changed_when: false
      check_mode: false
      become: false
    - name: "SCAN | Compute dynamic cryptographic and memory bounding recommendations"
      ansible.builtin.set_fact:
        discovered_disk_size_raw: "{{ ansible_facts['devices'][auto_disk_discovery.stdout | default('sda') | regex_replace('^/dev/', '')]['size'] | default('100 GB', true) }}"
        
        # PURE AUTOMATED PROBE: Scans chassis, CPU suffix [UMH], Core 2 Duo, or generic 'Mobile' tags safely without hardcoding
        computed_desktop_flag: >-
          {{
            true if (
              ansible_facts['chassis_type'] | default('unknown') | lower in ['laptop', 'notebook', 'unknown'] or
              local_host_cpu_probe.stdout | default('') is regex('.*[- ][0-9]+[UMH].*') or
              local_host_cpu_probe.stdout | default('') is search('Mobile') or
              local_host_cpu_probe.stdout | default('') is search('Core 2 Duo')
            ) else false
          }}

    - name: "SCAN | Finalize hardware metric calculation loops (Adaptive Sizing Tiers)"
      ansible.builtin.set_fact:
        vault_max_suggested: "{{ ((discovered_disk_size_raw | split(' ') | first | float * 0.20) | int) if (discovered_disk_size_raw | split(' ') | first | float | int) > 25 else 10 }}"
        computed_swap_mb: >-
          {{
            4096 if not (computed_desktop_flag | bool) else
            (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
            (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
            4096
          }}

    - name: "PHASE 1 | PROMPT | Display Discovered System Topography Metrics"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "               AUTOMATED HARDWARE PROBING RECON              "
          - "============================================================"
          - " TARGET HARDWARE DRIVE PATH: {{ auto_disk_discovery.stdout | default('/dev/sda', true) }}"
          - " PHYSICAL HARDWARE CAPACITY: {{ discovered_disk_size_raw | default('UNKNOWN', true) }}"
          - " INSTALLED SYSTEM MEMORY...: {{ ansible_facts['memtotal_mb'] | default(4096, true) }} MB"
          - " MEDIA STORAGE CAP BLOCK...: {{ auto_media_type.stdout | default('UNKNOWN', true) }}"
          - " DETECTED NETWORK INTERFACES: {{ auto_network_discovery.stdout | default('lo', true) }}"
          - " DETECTED LOCAL TIMEZONE...: {{ ansible_facts['date_time']['tz'] | default('UTC', true) }}"
          - " CHASSIS SCAN DEPLOY TARGET: {{ 'LAPTOP/MOBILE WORKSTATION' if (computed_desktop_flag | default(true) | bool) else 'HEADLESS SERVER/NODE' }}"
          - " RECON FIRMWARE PROFILE....: {{ 'UEFI (GPT)' if efi_directory_check.rc == 0 else 'BIOS-LEGACY (MBR)' }}"
          - "============================================================"
          - " >>> SUGGESTED VAULT LIMITS: 5 GB to {{ vault_max_suggested | default(10, true) }} GB max."
          - " >>> CALCULATED HARDENED SWAP SPACE FOOTPRINT: {{ computed_swap_mb | default(4096, true) }} MB."
          - "============================================================"

    - name: "PHASE 1 | PROMPT | Select Target Architecture Layout Standard"
      ansible.builtin.pause:
        prompt: |
          ============================================================
          SELECT ARCHITECTURE LAYOUT TYPE:
            1. The Pentagon Setup (Expert Install)
            2. The Fortress Setup (Standard Setup)
          ============================================================
          [?] Enter selection number (1 or 2) [Default: 1]
      register: layout_style_prompt

    # =========================================================================
    # PHASE 1.5 | INTERACTIVE RUNTIME CREDENTIALS & SECURITY INGESTION SEEDING
    # =========================================================================
    - name: "PHASE 1.5 | PROMPT | Ingest Isolated Secure Storage Vault Allocation Footprint"
      ansible.builtin.pause:
        prompt: "[?] Enter size in GB for the Secure Storage Vault (0 to disable) [Suggested Max: {{ vault_max_suggested }} GB]"
      register: vault_size_prompt

    - name: "PHASE 1.5 | PROMPT | Ingest Master System LUKS Container Passphrase"
      ansible.builtin.pause:
        prompt: "[?] Enter Cryptographic Passphrase for Primary Storage Root Volume Container"
        echo: false
      register: os_pass_prompt

    - name: "PHASE 1.5 | PROMPT | Ingest Isolated Secondary Vault Container Passphrase"
      ansible.builtin.pause:
        prompt: "[?] Enter Cryptographic Passphrase for Secondary Isolated Data Vault [Leave Blank if Disabled]"
        echo: false
      register: vault_pass_prompt
      when: "vault_size_input | int > 0"
    - name: "PHASE 1.5 | PROMPT | Ingest Master Administrative User Password"
      ansible.builtin.pause:
        prompt: "[?] Enter password for the root superuser account"
        echo: false
      register: root_pass_prompt

    - name: "PHASE 1.5 | PROMPT | Ingest Default Privileged Operating System System Account Name"
      ansible.builtin.pause:
        prompt: "[?] Enter username for the privileged system operator [Default: vega]"
      register: user_prompt

    - name: "PHASE 1.5 | PROMPT | Ingest Default Privileged Operating System System Account Password"
      ansible.builtin.pause:
        prompt: "[?] Enter password for the privileged user account ({{ target_username }})"
        echo: false
      register: user_pass_prompt

    - name: "PHASE 1.5 | PROMPT | Ingest Target Host Identification Network Node Name"
      ansible.builtin.pause:
        prompt: "[?] Enter host networking identification name for this node [Default: fortress-node]"
      register: hostname_prompt

    - name: "PHASE 1.5 | SYNTHESIS | Consolidate variables and evaluate execution facts"
      ansible.builtin.set_fact:
        # NATIVE DRY-RUN FIX: If running --check, it injects safe mockup values completely hands-free
        vault_size_input: "{{ vault_size_prompt.user_input | default('0', true) | int if not ansible_check_mode else 0 }}"
        os_passphrase: "{{ os_pass_prompt.user_input | default('', true) if not ansible_check_mode else 'check_mode_mock_pass' }}"
        vault_passphrase: "{{ vault_pass_prompt.user_input | default('', true) if not ansible_check_mode else 'check_mode_mock_vault' }}"
        vault_root_password: "{{ root_pass_prompt.user_input | default('', true) if not ansible_check_mode else 'check_mode_mock_root' }}"
        target_username: "{{ user_prompt.user_input | default('vega', true) if not ansible_check_mode else 'vega' }}"
        vault_user_password: "{{ user_pass_prompt.user_input | default('', true) if not ansible_check_mode else 'check_mode_mock_user' }}"
        target_hostname: "{{ hostname_prompt.user_input | default('fortress-node', true) if not ansible_check_mode else 'fortress-node' }}"
        
        # Core substrate mappings
        target_disk: "{{ auto_disk_discovery.stdout | default('/dev/sda', true) | trim }}"
        layout_selection: "{{ layout_style_prompt.user_input | default('1', true) | trim if not ansible_check_mode else '1' }}"
        has_vault: "{{ true if vault_size_input | int > 0 else false }}"
        stage1_swap_mb: "{{ computed_swap_mb | int }}"
        is_uefi: "{{ efi_directory_check.rc == 0 if efi_directory_check.rc is defined else false }}"
        os_crypt_dev: "/dev/mapper/{{ os_crypt_name }}"
        vault_crypt_dev: "/dev/mapper/{{ vault_crypt_name }}"
        is_nvme: "{{ 'nvme' in auto_disk_discovery.stdout | default('sda') }}"

    - name: "PHASE 1.5 | FACT | Map explicit drive partition node strings matching bus styles"
      ansible.builtin.set_fact:
        part_p1: "{{ target_disk ~ 'p1' if is_nvme | bool else target_disk ~ '1' }}"
        part_p2: "{{ target_disk ~ 'p2' if is_nvme | bool else target_disk ~ '2' }}"
        part_p3: "{{ target_disk ~ 'p3' if is_nvme | bool else target_disk ~ '3' }}"
        part_p4: "{{ target_disk ~ 'p4' if is_nvme | bool else target_disk ~ '4' }}"

    - name: "PHASE 1.5 | FACT | Compile cross-distribution blueprint pointers matching host tracking metrics"
      ansible.builtin.set_fact:
        target_env_os: "{{ 'Archlinux' if ansible_facts['os_family'] == 'Archlinux' else 'Debian' if ansible_facts['os_family'] == 'Debian' else 'RedHat' if ansible_facts['os_family'] == 'RedHat' else 'Suse' }}"

    # =========================================================================
    # PHASE 2 | SYSTEM EXCLUSIVE STORAGE BOUNDARY AND PARTITION ZEROING
    # =========================================================================
    - name: "PHASE 2 | STORAGE | Flush pre-existing logical device pathways, arrays and tracking matrices"
      ansible.builtin.shell: |
        swapoff -a || true
        umount -R /mnt/target || true
        cryptsetup close {{ os_crypt_name }} || true
        cryptsetup close {{ vault_crypt_name }} || true
        mdadm --stop /dev/md* || true
        vgchange -an || true
      failed_when: false
      changed_when: false
    - name: "PHASE 2 | STORAGE | Wipe primary allocation sector blocks natively"
      ansible.builtin.command: "sgdisk --zap-all {{ target_disk }}"
      changed_when: true

    - name: "PHASE 2 | STORAGE | Partition storage boundaries following architectural layouts (UEFI Matrix)"
      ansible.builtin.command: "{{ item }}"
      loop:
        - "sgdisk -n 1:0:+1024M -t 1:ef00 -c 1:'EFI_SYSTEM_SUBSTRATE' {{ target_disk }}"
        - "sgdisk -n 2:0:+2048M -t 2:8300 -c 2:'CRYPT_BOOT_ENVELOPE' {{ target_disk }}"
        - "sgdisk -n 3:0:+{{ vault_size_input }}G -t 3:8300 -c 3:'CRYPT_DATA_VAULT' {{ target_disk }}"
        - "sgdisk -n 4:0:0 -t 4:8300 -c 4:'CRYPT_OS_ROOT' {{ target_disk }}"
      when: 
        - "is_uefi | bool"
        - "has_vault | bool"

    - name: "PHASE 2 | STORAGE | Partition storage boundaries following architectural layouts (UEFI No-Vault Matrix)"
      ansible.builtin.command: "{{ item }}"
      loop:
        - "sgdisk -n 1:0:+1024M -t 1:ef00 -c 1:'EFI_SYSTEM_SUBSTRATE' {{ target_disk }}"
        - "sgdisk -n 2:0:+2048M -t 2:8300 -c 2:'CRYPT_BOOT_ENVELOPE' {{ target_disk }}"
        - "sgdisk -n 4:0:0 -t 4:8300 -c 4:'CRYPT_OS_ROOT' {{ target_disk }}"
      when: 
        - "is_uefi | bool"
        - "not has_vault | bool"
    - name: "PHASE 2 | STORAGE | Partition storage boundaries following architectural layouts (BIOS Matrix)"
      ansible.builtin.command: "{{ item }}"
      loop:
        - "sgdisk -n 2:0:+2048M -t 2:8300 -c 2:'CRYPT_BOOT_ENVELOPE' {{ target_disk }}"
        - "sgdisk -n 3:0:+{{ vault_size_input }}G -t 3:8300 -c 3:'CRYPT_DATA_VAULT' {{ target_disk }}"
        - "sgdisk -n 4:0:0 -t 4:8300 -c 4:'CRYPT_OS_ROOT' {{ target_disk }}"
      when: 
        - "not is_uefi | bool"
        - "has_vault | bool"

    - name: "PHASE 2 | STORAGE | Partition storage boundaries following architectural layouts (BIOS No-Vault Matrix)"
      ansible.builtin.command: "{{ item }}"
      loop:
        - "sgdisk -n 2:0:+2048M -t 2:8300 -c 2:'CRYPT_BOOT_ENVELOPE' {{ target_disk }}"
        - "sgdisk -n 4:0:0 -t 4:8300 -c 4:'CRYPT_OS_ROOT' {{ target_disk }}"
      when: 
        - "not is_uefi | bool"
        - "not has_vault | bool"

    - name: "PHASE 2 | STORAGE | Inform kernel of hot partition tables maps realignment"
      ansible.builtin.command: "partprobe {{ target_disk }}"
      changed_when: false
    # =========================================================================
    # PHASE 3 | ADVANCED CRYPTOGRAPHIC INITIALIZATION AND KEY HYDRO-INJECTION
    # =========================================================================
    - name: "PHASE 3 | CRYPTO | Initialize Primary Operating System Container via Hardened LUKS Parameters"
      ansible.builtin.shell: |
        echo -n "{{ os_passphrase }}" | cryptsetup luksFormat \
          --type luks2 \
          --cipher aes-xts-plain64 \
          --key-size 512 \
          --hash sha512 \
          --pbkdf argon2id \
          --iter-time 2000 \
          --use-urandom \
          {{ part_p4 }} -
      changed_when: true

    - name: "PHASE 3 | CRYPTO | Open cryptographic abstraction channel for primary system root"
      ansible.builtin.shell: |
        echo -n "{{ os_passphrase }}" | cryptsetup open {{ part_p4 }} {{ os_crypt_name }} -
      changed_when: true

    - name: "PHASE 3 | CRYPTO | Initialize Isolated Storage Vault Container via Hardened LUKS Parameters"
      ansible.builtin.shell: |
        echo -n "{{ vault_passphrase }}" | cryptsetup luksFormat \
          --type luks2 \
          --cipher aes-xts-plain64 \
          --key-size 512 \
          --hash sha512 \
          --pbkdf argon2id \
          --iter-time 2500 \
          --use-urandom \
          {{ part_p3 }} -
      changed_when: true
      when: "has_vault | bool"
    # =========================================================================
    # PHASE 4 | STRUCTURAL FORMATTING AND SECURE SUBVOLUME MANAGEMENT
    # =========================================================================
    - name: "PHASE 4 | STORAGE | Initialize primary high-performance Btrfs filesystem layer"
      ansible.builtin.command: "mkfs.btrfs -f -L 'SHIELDED_OS_ROOT' {{ os_crypt_dev }}"
      changed_when: true

    - name: "PHASE 4 | STORAGE | Establish temporary staging directory path anchors"
      ansible.builtin.file:
        path: "/mnt/target"
        state: "directory"
        mode: "0755"

    - name: "PHASE 4 | STORAGE | Mount primary volume array temporarily for subvolume tree layout carving"
      ansible.builtin.command: "mount {{ os_crypt_dev }} /mnt/target"
      changed_when: false

    - name: "PHASE 4 | STORAGE | Carve base structural subvolume root entries cleanly"
      ansible.builtin.command: "btrfs subvolume create /mnt/target/{{ item }}"
      loop: ['@', '@home', '@swap', '@snapshots', '@log', '@cache', '@docker', '@flatpak', '@srv']
      changed_when: true

    - name: "PHASE 4 | STORAGE | Unmount primary staging disk layer to reset workspace hooks"
      ansible.builtin.command: "umount /mnt/target"
      changed_when: false
    # =========================================================================
    # PHASE 5 | LINEAR CHRONOLOGICAL MOUNT ALIGNMENT LAYERS
    # =========================================================================
    - name: "PHASE 5 | MOUNT | Secure system root matrix mount pointer paths"
      ansible.builtin.command: "mount -o {{ perf_mount_opts }},subvol=@ {{ os_crypt_dev }} /mnt/target"
      changed_when: false

    - name: "PHASE 5 | MOUNT | Anchor child mount subdirectories cleanly"
      ansible.builtin.file:
        path: "/mnt/target{{ item.dest }}"
        state: "directory"
        mode: "0755"
      loop:
        - { name: '@home', dest: '/home' }
        - { name: '@swap', dest: '/swap' }
        - { name: '@snapshots', dest: '/.snapshots' }
        - { name: '@log', dest: '/var/log' }
        - { name: '@cache', dest: '/var/cache' }
        - { name: '@srv', dest: '/srv' }
      when: "item.dest != '/'"

    - name: "PHASE 5 | MOUNT | Mount complete decoupled subvolume array into targeted path positions"
      ansible.builtin.command: "mount -o {{ perf_mount_opts if item.dest != '/swap' else swap_mount_opts }},subvol={{ item.name }} {{ os_crypt_dev }} /mnt/target{{ item.dest }}"
      loop:
        - { name: '@home', dest: '/home' }
        - { name: '@swap', dest: '/swap' }
        - { name: '@snapshots', dest: '/.snapshots' }
        - { name: '@log', dest: '/var/log' }
        - { name: '@cache', dest: '/var/cache' }
        - { name: '@srv', dest: '/srv' }
      changed_when: false

    - name: "PHASE 5 | MOUNT | Format cleartext bootloader filesystem infrastructure allocation paths"
      ansible.builtin.command: "mkfs.ext4 -F -L 'SECURE_BOOT' {{ part_p2 }}"
      changed_when: true

    - name: "PHASE 5 | MOUNT | Attach boot paths straight into operating system storage boundary paths"
      ansible.builtin.command: "mount {{ part_p2 }} /mnt/target/boot"
      changed_when: false
    - name: "PHASE 5 | MOUNT | Format UEFI motherboard firmware allocations"
      ansible.builtin.command: "mkfs.vfat -F 32 -n 'EFI_SYS' {{ part_p1 }}"
      when: "is_uefi | bool"
      changed_when: true

    - name: "PHASE 5 | MOUNT | Establish firm mounting anchors for motherboard efi parameters"
      ansible.builtin.file:
        path: "/mnt/target/boot/efi"
        state: "directory"
        mode: "0755"
      when: "is_uefi | bool"

    - name: "PHASE 5 | MOUNT | Attach EFI hardware allocation nodes to the primary deployment path"
      ansible.builtin.command: "mount {{ part_p1 }} /mnt/target/boot/efi"
      when: "is_uefi | bool"
      changed_when: false

    # =========================================================================
    # PHASE 6 | SYSTEM INTERFACES SYMMETRICAL KEYRING REFRESH MATRICES
    # =========================================================================
    - name: "PHASE 6 | REPO KEYRING | Hydrate pacman system keyrings to clear corrupted package errors"
      ansible.builtin.shell: |
        pacman-key --init || true
        pacman-key --populate || true
        pacman -Sy --noconfirm archlinux-keyring || true
      failed_when: false
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"
    # =========================================================================
    # PHASE 7 | BASE OPERATING SYSTEM BOOTSTRAPPING MATRIX
    # =========================================================================
    - name: "PHASE 7 | BOOTSTRAP | Provision core operating system frameworks across paths"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          pacstrap -K /mnt/target base linux linux-firmware sudo btrfs-progs
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          apt-get install -y debootstrap && debootstrap stable /mnt/target http://debian.org
        fi
      changed_when: true

    # =========================================================================
    # PHASE 8 | HYBRID MEMORY ALIGNMENT & HARDENED SWAP SPACE ISOLATION
    # =========================================================================
    - name: "PHASE 8 | SWAP | Touch zero-byte clean swap allocation file anchor"
      ansible.builtin.file:
        path: "/mnt/target/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: "PHASE 8 | SWAP | Strip compression properties and isolate from Btrfs CoW rules"
      ansible.builtin.command: "chattr +C /mnt/target/swap/swapfile"
      changed_when: false

    - name: "PHASE 8 | SWAP | Force allocate completely contiguous uncompressed disk blocks matching formula metrics"
      ansible.builtin.command: "fallocate -l {{ stage1_swap_mb }}M /mnt/target/swap/swapfile"
      changed_when: true

    - name: "PHASE 8 | SWAP | Format allocation space using standard kernel swap headers"
      ansible.builtin.command: "mkswap /mnt/target/swap/swapfile"
      changed_when: false
    # =========================================================================
    # SYSTEMD ZRAM-GENERATOR HARDENED BOOT INFRASTRUCTURE PRESETS
    # =========================================================================
    - name: "PHASE 8.5 | ZRAM | Deploy optimized compressed memory systemd configuration parameters"
      ansible.builtin.copy:
        content: |
          # [⚡ Hardened ZRAM Infrastructure Blueprint]
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = lz4
        dest: "/mnt/target/etc/systemd/zram-generator.conf"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "LOGGING | Output ultimate security baseline status matrix card"
      ansible.builtin.debug:
        msg: |
          ===========================================================================
                                 STAGE 1 VERIFICATION SUCCESS                        
          ===========================================================================
          [✔] SUCCESS: Stage#1 Successfully Deployed!
          
          🛡️ CRYPTOGRAPHIC CONTAINER STORAGE STATUS:
              Your devices are now fully encrypted and locked behind Argon2id pools:
              ➔ PRIMARY OPERATING SYSTEM VOLUME: {{ target_disk }} (Encrypted Container)
              {% if has_vault | bool %}    ➔ HARDENED SENSITIVE DATA VAULT...: {{ part_p3 }} (Keyfile Sealed Container){% else %}    ➔ HARDENED SENSITIVE DATA VAULT...: Bypassed / Not Provisioned{% endif %}
          
          ⚙️ SUBSURFACE MEMORY TOPOGRAPHY MATRIX:
              ➔ Hardened Allocation Swap Nodes...: {{ stage1_swap_mb }} MB (Mode 0600 +C Exempt)
              ➔ Compressed Volatile ZRAM Pool....: Active (Native LZ4 Kernel Governor)
          ---------------------------------------------------------------------------
                                 RECOMMENDED NEXT LIFECYCLE STEP                     
          ---------------------------------------------------------------------------
           [!] NOTICE: Your foundational storage substrate is completely secure,     
               but the operating system userland is currently running unshielded.    
          
           💡 SUGGESTION: Stack this architecture baseline with Stage#2 for full     
              system hardening! Passing control cleanly to Stage 2 will deploy:      
              ➔ Low-Level Kernel Runtime Parameter Shielding (sysctl restrictions)   
              ➔ Advanced Userland Application Containment (Firejail Sandbox Vectors) 
              ➔ Host Intrusion Auditing & Real-time Integrity Traps (auditd & AIDE)  
              ➔ Zero-Trust Packet Inspection Network Rule-sets (firewalld controls)  
          
           Run the next envelope phase via: ansible-playbook Stage#2-Post-Hardening.yml   
          ===========================================================================
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 11 | CHROOT USERLAND CREDENTIAL GENERATION & VISUDO LOCKS
    # =========================================================================
    - name: "PHASE 11 | SYSTEM SPECIFIC | Inject core identity and hostname metadata parameters natively"
      ansible.builtin.shell: |
        echo "{{ target_hostname }}" > /mnt/target/etc/hostname
      when: "not ansible_check_mode"

    - name: "PHASE 11 | VISUDO | Write privilege definitions with absolute syntax validation checks"
      ansible.posix.mount:
        path: "/mnt/target/etc/sudoers.d/{{ target_username }}"
        src: "none"
        fstype: "tmpfs"
        opts: "defaults"
        state: "absent"
      when: "ansible_check_mode"
    - name: "PHASE 11.5 | SYSTEM CONFIG | Populate static data layout tracking metrics (/etc/fstab)"
      ansible.builtin.copy:
        content: |
          # /etc/fstab: Static file system configuration definitions
          /dev/mapper/{{ os_crypt_name }}   /               btrfs   rw,{{ perf_mount_opts }},subvol=@ 0 0
          /dev/mapper/{{ os_crypt_name }}   /home           btrfs   rw,{{ perf_mount_opts }},subvol=@home 0 0
          /dev/mapper/{{ os_crypt_name }}   /swap           btrfs   rw,{{ swap_mount_opts }},subvol=@swap 0 0
          /dev/mapper/{{ os_crypt_name }}   /.snapshots     btrfs   rw,{{ perf_mount_opts }},subvol=@snapshots 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/log        btrfs   rw,{{ perf_mount_opts }},subvol=@log 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/cache      btrfs   rw,{{ perf_mount_opts }},subvol=@cache 0 0
          /swap/swapfile                   none            swap    defaults,pri=10,discard 0 0
          {% if is_fortress | bool %}
          {{ boot_partition }}              /boot           ext4    defaults,noatime 0 2
          {% endif %}
          {% if is_uefi | bool %}
          {{ esp_partition }}               /boot/efi       vfat    defaults,noatime 0 2
          {% endif %}
        dest: "/mnt/target/etc/fstab"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 11.5 | SYSTEM CONFIG | Map target encryption unlock keys (/etc/crypttab)"
      ansible.builtin.copy:
        content: |
          # <target name> <source device> <key file> <options>
          {{ os_crypt_name }} {{ part_p4 }} none luks,discard
        dest: "/mnt/target/etc/crypttab"
        owner: "root"
        group: "root"
        mode: "0440"
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 12 | CLEANUP AND CHROOT ENVIRONMENT TEARDOWN
    # =========================================================================
    - name: "PHASE 12 | CLEANUP | Safely disconnect virtual staging directory operating system structures"
      ansible.builtin.shell: |
        umount -l /mnt/target/dev/pts || true
        umount -l /mnt/target/dev || true
        umount -l /mnt/target/proc || true
        umount -l /mnt/target/sys || true
        swapoff /mnt/target/swap/swapfile || true
        umount -R /mnt/target || true
      failed_when: false
      when: "not ansible_check_mode"

  handlers:
    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true

