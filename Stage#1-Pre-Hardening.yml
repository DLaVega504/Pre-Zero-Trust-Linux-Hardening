---
- name: "Universal Interactive Turn-Key Linux Pre-Hardening Framework (Stage 1)"
  hosts: all
  gather_facts: false # SAFE: Bypasses immediate fact crash on bare-metal environments
  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    swap_mount_opts: "noatime,space_cache=v2,nodatacow"
    
    # Programmatic choice variable assignments
    vault_size_input: "{{ vault_size_prompt.user_input | default(vault_max_suggested, true) | int }}"
    os_passphrase: "{{ os_pass_prompt.user_input | default('', true) }}"
    vault_passphrase: "{{ vault_pass_prompt.user_input | default('', true) }}"
    grub_admin_password: "{{ grub_pass_prompt.user_input | default('', true) }}"
    vault_root_password: "{{ root_pass_prompt.user_input | default('', true) }}"
    target_username: "{{ user_prompt.user_input | default('vega', true) }}"
    vault_user_password: "{{ user_pass_prompt.user_input | default('', true) }}"
    target_hostname: "{{ hostname_prompt.user_input | default('fortress-node', true) }}"

  tasks:

    # =========================================================================
    # PRE-FLIGHT LIVE ISO ENVIRONMENT HYDRATION ENGINE
    # =========================================================================
    - name: "PRE-FLIGHT | Automatically provision runtime dependencies on Live ISO host"
      ansible.builtin.raw: |
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip gptfdisk ansible
        fi
      become: true # Enforces root status ONLY for installing tools if needed
      changed_when: false
      failed_when: false

    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup: # Gathers system variables safely without triggering nested sudo traps
      become: false # <--- CRITICAL FIX: Eliminates the double privilege prompt loop completely

    # =========================================================================
    # PHASE 1 | AUTOMATED HARDWARE, METADATA & RECONNAISSANCE SCANNING ENGINE
    # =========================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.command: "test -d /sys/firmware/efi"
      register: efi_directory_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect unmounted target storage device blocks"
      ansible.builtin.shell: |
        lsblk -dnro NAME,TYPE | awk '$2=="disk" {print "/dev/"$1}' | head -n 1
      register: auto_disk_discovery
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect drive media rotation profiles (HDD vs SSD/Virtual)"
      ansible.builtin.shell: |
        DEV_NAME=$(basename "{{ auto_disk_discovery.stdout | default('sda') }}")
        if [ -f "/sys/block/$DEV_NAME/queue/rotational" ]; then
          if [ "$(cat /sys/block/$DEV_NAME/queue/rotational)" = "0" ]; then
            echo "SSD/VIRTUAL"
          else
            echo "MECHANICAL_HDD"
          fi
        else
          echo "UNKNOWN"
        fi
      register: auto_media_type
      changed_when: false
      check_mode: false

    - name: "SCAN | Discover active network card interface node names"
      ansible.builtin.shell: |
        ip -br link show | awk '$1 !~ /lo|virbr|docker/ {print $1}' | paste -sd "," -
      register: auto_network_discovery
      changed_when: false
      check_mode: false
    # =========================================================================
    # PHASE 1.5 | AUTOMATED STORAGE MATH & CHASSIS PROFILE PROBING CARD
    # =========================================================================
    - name: "SCAN | Compute dynamic cryptographic and memory bounding recommendations"
      ansible.builtin.set_fact:
        discovered_disk_size_raw: "{{ ansible_facts['devices'][auto_disk_discovery.stdout | default('sda') | regex_replace('^/dev/', '')]['size'] | default('100 GB', true) }}"
        computed_desktop_flag: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"

    - name: "SCAN | Finalize hardware metric calculation loops"
      ansible.builtin.set_fact:
        vault_max_suggested: "{{ ((discovered_disk_size_raw | split(' ') | first | float * 0.20) | int) if (discovered_disk_size_raw | split(' ') | first | float | int) > 25 else 10 }}"
        computed_swap_mb: >-
          {{
            4096 if not (computed_desktop_flag | bool) else
            (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
            (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
            4096
          }}

    - name: "PHASE 1 | PROMPT | Select Target Architecture Layout Standard"
      ansible.builtin.pause:
        prompt: |
          ============================================================
          SELECT ARCHITECTURE LAYOUT TYPE:
            1. The Pentagon Setup (Expert Install)
            2. The Fortress Setup (Industry Install)
          ============================================================
          [?] Enter selection number (1 or 2) [Default: 1]
      register: layout_style_prompt

    - name: "PHASE 1 | PROMPT | Display Discovered System Topography Metrics"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "               AUTOMATED HARDWARE PROBING RECON              "
          - "============================================================"
          - " TARGET HARDWARE DRIVE PATH: {{ auto_disk_discovery.stdout | default('/dev/sda', true) }}"
          - " PHYSICAL HARDWARE CAPACITY: {{ discovered_disk_size_raw | default('UNKNOWN', true) }}"
          - " INSTALLED SYSTEM MEMORY...: {{ ansible_facts['memtotal_mb'] | default(4096, true) }} MB"
          - " MEDIA STORAGE CAP BLOCK...: {{ auto_media_type.stdout | default('UNKNOWN', true) }}"
          - " DETECTED NETWORK INTERFACES: {{ auto_network_discovery.stdout | default('lo', true) }}"
          - " DETECTED LOCAL TIMEZONE...: {{ ansible_facts['date_time']['tz'] | default('UTC', true) }}"
          - " CHASSIS SCAN DEPLOY TARGET: {{ 'LAPTOP/MOBILE' if (ansible_facts.chassis_type is defined and ansible_facts['chassis_type'] | lower in ['laptop','notebook']) else 'FIXED DESKTOP WORKSTATION' if (computed_desktop_flag | default(true) | bool) else 'HEADLESS SERVER/NODE' }}"
          - " RECON FIRMWARE PROFILE....: {{ 'UEFI (GPT)' if efi_directory_check.rc == 0 else 'BIOS-LEGACY (MBR)' }}"
          - "============================================================"
          - " >>> SUGGESTED VAULT LIMITS: 5 GB to {{ vault_max_suggested | default(10, true) }} GB max."
          - " >>> CALCULATED HARDENED SWAP SPACE FOOTPRINT: {{ computed_swap_mb | default(4096, true) }} MB."
          - "============================================================"
    - name: "PHASE 1 | PROMPT | Gather unique system hostname identity"
      ansible.builtin.pause:
        prompt: "[?] Enter unique system hostname [fortress-node]"
      register: hostname_prompt

    - name: "PHASE 1 | PROMPT | Gather secure vault sizing metrics"
      ansible.builtin.pause:
        prompt: "Enter the size for the Vault partition in GB (5 to {{ vault_max_suggested | default(10, true) }} GB recommended, or enter 0 to SKIP) [Default: {{ vault_max_suggested | default(10, true) }}]"
      register: vault_size_prompt

    - name: "PHASE 1 | PROMPT | Gather master disk passphrases"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Main OS Partition (Typed at boot)"
        echo: false
      register: os_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather GRUB menu hash lockout key"
      ansible.builtin.pause:
        prompt: "Enter Hashed Protection Password for GRUB parameters (Used in FORTRESS setup)"
        echo: false
      register: grub_pass_prompt
      when: "layout_style_prompt.user_input | default('1', true) == '2'"

    - name: "PHASE 1 | PROMPT | Gather Vault Passphrase"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Secure Vault Partition (Bypassed if size is 0)"
        echo: false
      register: vault_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather ROOT Administrative Password"
      ansible.builtin.pause:
        prompt: "Enter System Administrative ROOT Password"
        echo: false
      register: root_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather Account Username"
      ansible.builtin.pause:
        prompt: "[?] Enter account username for regular user [vega]"
      register: user_prompt

    - name: "PHASE 1 | PROMPT | Gather Account Password"
      ansible.builtin.pause:
        prompt: "Enter the account password for the regular user"
        echo: false
      register: user_pass_prompt
    # =========================================================================
    # PHASE 2 | ENVIRONMENT COMPILATION & VARIABLE ASSIGNMENTS
    # =========================================================================
    - name: "PHASE 2 | VALIDATION | Validate chosen Vault size constraints"
      ansible.builtin.assert:
        that:
          - "vault_size_input == 0 or (vault_size_input >= 5 and vault_size_input <= 60)"
        msg: "FATAL ERROR: Vault partition size specification parameters must be 0 or bound between 5 and 60 GB."

    - name: "PHASE 2 | RECON | Compile environment configuration variables automatically"
      ansible.builtin.set_fact:
        is_uefi: "{{ efi_directory_check.rc == 0 }}"
        target_disk: "{{ auto_disk_discovery.stdout | default('/dev/sda', true) }}"
        target_timezone: "{{ ansible_facts['date_time']['tz'] | default('UTC', true) }}"
        p_suffix: "{{ 'p' if 'nvme' in auto_disk_discovery.stdout | default('', true) else '' }}"
        is_workstation: "{{ computed_desktop_flag | bool }}"
        has_vault: "{{ vault_size_input > 0 }}"
        is_fortress: "{{ layout_style_prompt.user_input | default('1', true) == '2' }}"
        is_desktop: "{{ computed_desktop_flag | bool }}"
        stage1_swap_mb: "{{ computed_swap_mb | int }}"
        system_profile: >-
          {{
            'server' if not (computed_desktop_flag | bool) else
            'laptop' if (ansible_facts['chassis_type'] is defined and ansible_facts['chassis_type'] | lower in ['laptop', 'notebook']) else
            'desktop'
          }}

    - name: "PHASE 2 | STORAGE | Load multi-distribution subvolume blueprints"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "PHASE 2 | RECON | Select active target system baseline values"
      ansible.builtin.set_fact:
        active_blueprint: "{{ distro_blueprint.distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else distro_blueprint.distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else distro_blueprint.distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else distro_blueprint.distro_blueprint.suse_vars }}"
        admin_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"
    # =========================================================================
    # PHASE 3 | PHYSICAL DISK SECTOR ALLOCATION PARSING ENGINE (parted)
    # =========================================================================
    - name: "PHASE 3 | STORAGE | Carve storage layouts matching selection rules"
      ansible.builtin.shell: |
        wipefs -a --force {{ target_disk }}
        sgdisk --zap-all {{ target_disk }}
        
        if [ "{{ is_fortress | bool }}" = "true" ]; then
          if [ -d /sys/firmware/efi ]; then
            parted -s {{ target_disk }} mklabel gpt
            parted -s {{ target_disk }} mkpart ESP fat32 1MiB 1025MiB
            parted -s {{ target_disk }} set 1 boot on
            parted -s {{ target_disk }} mkpart primary ext4 1025MiB 2049MiB
            if [ "{{ has_vault | bool }}" = "true" ]; then
              parted -s {{ target_disk }} mkpart primary btrfs 2049MiB -{{ vault_size_input }}GiB
              parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
            else
              parted -s {{ target_disk }} mkpart primary btrfs 2049MiB 100%
            fi
          else
            parted -s {{ target_disk }} mklabel msdos
            parted -s {{ target_disk }} mkpart primary ext4 1MiB 1025MiB
            parted -s {{ target_disk }} set 1 boot on
            if [ "{{ has_vault | bool }}" = "true" ]; then
              parted -s {{ target_disk }} mkpart primary btrfs 1025MiB -{{ vault_size_input }}GiB
              parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
            else
              parted -s {{ target_disk }} mkpart primary btrfs 1025MiB 100%
            fi
          fi
        else
          if [ -d /sys/firmware/efi ]; then
            parted -s {{ target_disk }} mklabel gpt
            parted -s {{ target_disk }} mkpart ESP fat32 1MiB 1025MiB
            parted -s {{ target_disk }} set 1 boot on
            if [ "{{ has_vault | bool }}" = "true" ]; then
              parted -s {{ target_disk }} mkpart primary btrfs 1025MiB -{{ vault_size_input }}GiB
              parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
            else
              parted -s {{ target_disk }} mkpart primary btrfs 1025MiB 100%
            fi
          else
            parted -s {{ target_disk }} mklabel msdos
            if [ "{{ has_vault | bool }}" = "true" ]; then
              parted -s {{ target_disk }} mkpart primary btrfs 1MiB -{{ vault_size_input }}GiB
              parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
            else
              parted -s {{ target_disk }} mkpart primary btrfs 1MiB 100%
            fi
            parted -s {{ target_disk }} set 1 boot on
          fi
        fi
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 4 & 5 | CRYPTO LOOP LAYERS AND DEPENDENCY-SORTED WORKSPACE MOUNTING
    # =========================================================================
    - name: "PHASE 3 | LUKS | Map system partition layout node targets"
      ansible.builtin.set_fact:
        esp_partition: "{{ target_disk }}{{ p_suffix }}1"
        boot_partition: "{{ (target_disk + p_suffix + '2') if (is_uefi | bool) else (target_disk + p_suffix + '1') }}"
        os_partition: "{{ (target_disk + p_suffix + '3') if (is_fortress | bool and is_uefi | bool) else (target_disk + p_suffix + '2') if (is_fortress | bool and not is_uefi | bool) else (target_disk + p_suffix + '2') if (not is_fortress | bool and is_uefi | bool) else (target_disk + p_suffix + '1') }}"
        vault_partition: "{{ (target_disk + p_suffix + '4') if (is_fortress | bool and is_uefi | bool and has_vault | bool) else (target_disk + p_suffix + '3') if (is_fortress | bool and not is_uefi | bool and has_vault | bool) else (target_disk + p_suffix + '3') if (not is_fortress | bool and is_uefi | bool and has_vault | bool) else (target_disk + p_suffix + '2') if (not is_fortress | bool and not is_uefi | bool and has_vault | bool) else 'none' }}"

    - name: "PHASE 4 | LUKS | Initialize primary operating system encryption container"
      ansible.builtin.shell: "if [ '{{ is_fortress | bool }}' = 'true' ]; then echo '{{ os_passphrase }}' | cryptsetup luksFormat --type luks2 --pbkdf argon2id --batch-mode {{ os_partition }}; else echo '{{ os_passphrase }}' | cryptsetup luksFormat --type luks1 --batch-mode {{ os_partition }}; fi"
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 4 | LUKS | Open master operating system decryption loop"
      ansible.builtin.shell: "echo '{{ os_passphrase }}' | cryptsetup open {{ os_partition }} {{ os_crypt_name }}"
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 4 | LUKS | Extract operating system hardware UUID tracking code"
      ansible.builtin.command: "blkid -s UUID -o value {{ os_partition }}"
      register: os_partition_uuid
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | BTRFS | Initialize storage filesystem pool"
      ansible.builtin.shell: "mkfs.btrfs -f /dev/mapper/{{ os_crypt_name }}"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Establish temporary staging root mount point"
      ansible.builtin.command: "mount /dev/mapper/{{ os_crypt_name }} /mnt"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Carve full 13-subvolume system hierarchy layout"
      ansible.builtin.command: "btrfs subvolume create /mnt/{{ item.name }}"
      loop: "{{ active_blueprint.subvolumes }}"
      become: true
      when: "not ansible_check_mode"
    - name: "PHASE 5 | STORAGE | openSUSE SPECIFIC | Instantiate internal Snapper snapshot chamber"
      ansible.builtin.shell: "mkdir -p /mnt/@/.snapshots/1 && btrfs subvolume create /mnt/@/.snapshots/1/snapshot"
      become: true
      when: "ansible_facts['os_family'] == 'Suse' and not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Close temporary tracking connection to disk layout"
      ansible.builtin.command: "umount /mnt"
      become: true
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Enforce clean installation target path folders"
      ansible.builtin.file:
        path: "/mnt/target"
        state: "directory"
        mode: "0755"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Mount active distribution system root subvolume"
      ansible.builtin.shell: "if [ '{{ ansible_facts['os_family'] }}' = 'Suse' ]; then mount -o rw,{{ perf_mount_opts }},subvol=@/.snapshots/1/snapshot /dev/mapper/{{ os_crypt_name }} /mnt/target; elif [ '{{ ansible_facts['os_family'] }}' = 'RedHat' ]; then mount -o rw,{{ perf_mount_opts }},subvol=root /dev/mapper/{{ os_crypt_name }} /mnt/target; elif [ '{{ ansible_facts['os_family'] }}' = 'Debian' ]; then mount -o rw,{{ perf_mount_opts }},subvol=@rootfs /dev/mapper/{{ os_crypt_name }} /mnt/target; else mount -o rw,{{ perf_mount_opts }},subvol=@ /dev/mapper/{{ os_crypt_name }} /mnt/target; fi"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Create parent folder layouts in proper order (SORTED TO PREVENT RACE CONDITIONS)"
      ansible.builtin.file:
        path: "/mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
        state: "directory"
        mode: "0755"
      loop: "{{ active_blueprint.subvolumes | sort(attribute='dest') }}"
      become: true
      when: "not ansible_check_mode and item.dest != '/'"

    - name: "PHASE 5 | STORAGE | Sequentially bind system subvolumes to target workspace paths (SORTED)"
      ansible.builtin.command: "mount -o rw,{{ swap_mount_opts if item.name == '@swap' or item.name == 'swap' else perf_mount_opts }},subvol={{ item.name }} /dev/mapper/{{ os_crypt_name }} /mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
      loop: "{{ active_blueprint.subvolumes | sort(attribute='dest') }}"
      become: true
      when: "not ansible_check_mode and item.dest != '/'"

    - name: "PHASE 5 | STORAGE | Format and mount structural hardware boot components"
      ansible.builtin.shell: "if [ '{{ is_fortress | bool }}' = 'true' ]; then mkfs.ext4 -F {{ boot_partition }} && mkdir -p /mnt/target/boot && mount {{ boot_partition }} /mnt/target/boot; fi; if [ -d /sys/firmware/efi ]; then mkfs.vfat -F32 {{ esp_partition }} && mkdir -p /mnt/target/boot/efi && mount {{ esp_partition }} /mnt/target/boot/efi; fi"
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 6 & 7 | HARDENED ISOLATED MEMORY STORAGE & BASELINE EXPANSION
    # =========================================================================
    - name: "PHASE 6 | STORAGE | Initialize baseline swapfile path tracking bounds"
      ansible.builtin.file:
        path: "/mnt/target/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Enforce mandatory Copy-on-Write exemption flags"
      ansible.builtin.command: "chattr +C /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Strip active system compression logic profiles"
      ansible.builtin.command: "btrfs property set /mnt/target/swap/swapfile compression none"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Populate block bits using calculated footprint limits"
      ansible.builtin.command: "dd if=/dev/zero of=/mnt/target/swap/swapfile bs=1M count={{ stage1_swap_mb }} status=progress"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Frame formal system swap signatures onto mapping layout"
      ansible.builtin.command: "mkswap /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Activate temporary swap configuration to verify drive boundaries"
      ansible.builtin.command: "swapon /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 7 | BOOTSTRAP | Provision hardware-ready system packages cleanly"
      ansible.builtin.shell: |
        CORE_NET_SEC=""
        HARDWARE_PKGS=""
        SYS_TYPE="{{ system_profile }}"

        # =========================================================================
        # PRE-FLIGHT INTERFACE: MULTI-DISTRO NATIVE KEYRING & UTILITY REFRESH
        # =========================================================================
        echo "[+] Initializing pre-flight cryptographic keys and partition wiping engines..."
        
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Sy --noconfirm archlinux-keyring gptfdisk || true
          
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          apt-get update -y || true
          apt-get install -y debian-archive-keyring gdisk || true
          
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          dnf check-update -y || true
          dnf install -y fedora-repos gdisk --nogpgcheck || true
          
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          zypper --non-interactive refresh || true
          zypper --non-interactive install --no-recommends openSUSE-release gptfdisk || true
        fi

        # =========================================================================
        # CONDITION: LAPTOP ENVIRONMENT SPECIFICS
        # =========================================================================
        if [ "$SYS_TYPE" = "laptop" ]; then
          if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
            CORE_NET_SEC="networkmanager firewalld"
            HARDWARE_PKGS="xorg-server xorg-xinit gnome lightdm gdm-settings bluez bluez-utils pipewire pipewire-audio pipewire-pulse wireplumber tlp powertop cups mesa xf86-video-vesa sof-firmware firejail firetools firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
            CORE_NET_SEC="network-manager firewalld"
            HARDWARE_PKGS="xorg gnome lightdm bluez pulseaudio pulseaudio-module-bluetooth power-profiles-daemon cups firmware-linux firejail firetools firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
            CORE_NET_SEC="NetworkManager firewalld"
            HARDWARE_PKGS="xorg-x11-server-Xorg gnome-shell lightdm bluez pipewire-alsa pipewire-pulseaudio power-profiles-daemon cups firejail firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
            CORE_NET_SEC="NetworkManager firewalld"
            HARDWARE_PKGS="xorg-x11 gdm lightdm bluez pipewire pipewire-pulseaudio power-profiles-daemon cups firejail firetools firewall-applet firewall-config"
          fi

        # =========================================================================
        # CONDITION: FIXED DESKTOP ENVIRONMENT SPECIFICS
        # =========================================================================
        elif [ "$SYS_TYPE" = "desktop" ]; then
          if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
            CORE_NET_SEC="networkmanager firewalld"
            HARDWARE_PKGS="xorg-server xorg-xinit gnome lightdm gdm-settings bluez bluez-utils pipewire pipewire-audio pipewire-pulse wireplumber tuned cups mesa firejail firetools firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
            CORE_NET_SEC="network-manager firewalld"
            HARDWARE_PKGS="xorg gnome lightdm bluez pulseaudio pulseaudio-module-bluetooth tuned cups firmware-linux firejail firetools firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
            CORE_NET_SEC="NetworkManager firewalld"
            HARDWARE_PKGS="xorg-x11-server-Xorg gnome-shell lightdm bluez pipewire-alsa pipewire-pulseaudio tuned cups firejail firewall-applet firewall-config"
          elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
            CORE_NET_SEC="NetworkManager firewalld"
            HARDWARE_PKGS="xorg-x11 gdm lightdm bluez pipewire pipewire-pulseaudio tuned cups firejail firewall-applet firewall-config"
          fi

        # =========================================================================
        # CONDITION: BARE-METAL HEADLESS SERVERS
        # =========================================================================
        else
          if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then CORE_NET_SEC="networkmanager firewalld"; HARDWARE_PKGS="tuned irqbalance openssh"; fi
          if [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then CORE_NET_SEC="network-manager firewalld"; HARDWARE_PKGS="tuned-utils irqbalance openssh-server"; fi
          if [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then CORE_NET_SEC="NetworkManager firewalld"; HARDWARE_PKGS="tuned irqbalance openssh-server"; fi
          if [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then CORE_NET_SEC="NetworkManager firewalld"; HARDWARE_PKGS="tuned irqbalance openssh"; fi
        fi

        BASE_UTIL="git make curl wget sudo btrfs-progs cryptsetup parted"

        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          pacstrap -K /mnt/target {{ active_blueprint.bootstrap_packages }} $BASE_UTIL $CORE_NET_SEC $HARDWARE_PKGS python python-pip
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          debootstrap --variant=minbase --include={{ active_blueprint.bootstrap_packages | replace(' ', ',') }},git,make,curl,wget,sudo,btrfs-progs,cryptsetup,parted,python3,python3-pip,python3-apt,$CORE_NET_SEC,$HARDWARE_PKGS stable /mnt/target http://debian.org
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          dnf --installroot=/mnt/target --releasever=latest groupinstall -y "Minimal Install" --setopt=install_weak_deps=False --nogpgcheck
          dnf --installroot=/mnt/target install -y {{ active_blueprint.bootstrap_packages }} $BASE_UTIL $CORE_NET_SEC $HARDWARE_PKGS python3 python3-pip python3-dnf --nogpgcheck
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          zypper --root /mnt/target --non-interactive install --no-recommends -t pattern base
          zypper --root /mnt/target --non-interactive install --no-recommends {{ active_blueprint.bootstrap_packages }} $BASE_UTIL $CORE_NET_SEC $HARDWARE_PKGS python3 python3-pip python3-zypper
        fi
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 8 | HIDDEN DATA VAULT STORAGE COMPILATION & EMBEDDED CONTROLLER
    # =========================================================================
    - name: "PHASE 8 | VAULT | Form enterprise LUKS2 container using primary Argon2id algorithms"
      ansible.builtin.shell: "echo '{{ vault_passphrase }}' | cryptsetup luksFormat --type luks2 --pbkdf argon2id --batch-mode {{ vault_partition }}"
      become: true
      no_log: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Create key storage directory inside target root"
      ansible.builtin.file:
        path: "/mnt/target/etc/secure"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0700"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Generate hidden random 32-byte cryptographically secure token"
      ansible.builtin.command: "dd if=/dev/urandom of=/mnt/target/etc/secure/vault.key bs=1 count=32"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Lock system key signatures strictly to root privileges"
      ansible.builtin.file:
        path: "/mnt/target/etc/secure/vault.key"
        owner: "root"
        group: "root"
        mode: "0400"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Inject the generated system keyfile into secondary slot of vault partition"
      ansible.builtin.shell: "echo '{{ vault_passphrase }}' | cryptsetup luksAddKey --batch-mode {{ vault_partition }} /mnt/target/etc/secure/vault.key"
      become: true
      no_log: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Open vault container endpoint utilizing hidden system key file"
      ansible.builtin.command: "cryptsetup open {{ vault_partition }} {{ vault_crypt_name }} --key-file /mnt/target/etc/secure/vault.key"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Extract hardware tracking UUID string from vault partition"
      ansible.builtin.command: "blkid -s UUID -o value {{ vault_partition }}"
      register: "vault_uuid_raw"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Format vault mapped target block space as clean BTRFS storage"
      ansible.builtin.shell: "mkfs.btrfs -f /dev/mapper/{{ vault_crypt_name }}"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Pre-carve required Btrfs secure vault subvolume tree root"
      ansible.builtin.shell: "mkdir -p /mnt/@vault_holder_tmp && mount /dev/mapper/{{ vault_crypt_name }} /mnt/@vault_holder_tmp && btrfs subvolume create /mnt/@vault_holder_tmp/@secure && umount /mnt/@vault_holder_tmp && rm -rf /mnt/@vault_holder_tmp"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Close encryption mapping layer to purge tracking elements from RAM"
      ansible.builtin.command: "cryptsetup close {{ vault_crypt_name }}"
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Deploy hardened multi-mount proof state monitoring utility"
      ansible.builtin.copy:
        dest: "/mnt/target/usr/local/bin/vault"
        owner: "root"
        group: "root"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -eo pipefail
          VAULT_DEV="{{ vault_partition }}"
          VAULT_MAP="{{ vault_crypt_name }}"
          VAULT_MNT="/vault"
          KEY_FILE="/etc/secure/vault.key"
          if [ "$EUID" -ne 0 ]; then
              echo "[-] ERROR: Sudo authentication credentials required to manage vault parameters." >&2
              exit 1
          fi
          case "$1" in
              open)
                  if findmnt -M "$VAULT_MNT" >/dev/null 2>&1; then
                      echo "[!] Warning: Data vault is already mounted and active at $VAULT_MNT."
                      exit 0
                  fi
                  if ! cryptsetup status "$VAULT_MAP" >/dev/null 2>&1; then
                      echo "[+] Unlocking hidden secure container substrate..."
                      cryptsetup open "$VAULT_DEV" "$VAULT_MAP" --key-file "$KEY_FILE"
                  fi
                  echo "[+] Binding secure subvolume framework..."
                  mkdir -p "$VAULT_MNT"
                  mount -o noatime,compress=zstd:1,subvol=@secure "/dev/mapper/$VAULT_MAP" "$VAULT_MNT"
                  echo "[✔] Data vault open."
                  ;;
              close)
                  if ! cryptsetup status "$VAULT_MAP" >/dev/null 2>&1 && ! findmnt -M "$VAULT_MNT" >/dev/null 2>&1; then
                      echo "[-] ERROR: open vault first." >&2
                      exit 1
                  fi
                  echo "[+] Recursively sweeping all active stacked mount layers..."
                  umount -R "$VAULT_MNT" 2>/dev/null || umount -l "$VAULT_MNT" || true
                  echo "[+] Sealing container and purging encryption keys from RAM..."
                  if cryptsetup status "$VAULT_MAP" >/dev/null 2>&1; then
                      cryptsetup close "$VAULT_MAP"
                  fi
                  echo "[✔] Data vault securely closed and sealed."
                  ;;
              *)
                  echo "Usage: $0 {open|close}" >&2
                  exit 1
                  ;;
          esac
      become: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | ALIAS | Provision shell helper configuration shortcuts"
      ansible.builtin.blockinfile:
        path: "/mnt/target/etc/bash.bashrc"
        marker: "# {mark} ANSIBLE SECURE VAULT ALIAS BLOCK"
        block: |
          alias vault-open="sudo /usr/local/bin/vault open"
          alias vault-close="sudo /usr/local/bin/vault close"
      become: true
      when: "not ansible_check_mode and has_vault | bool"
    # =========================================================================
    # PHASE 9 | CHROOT LEDGERS CONTEXT, KERNEL COMPILING & TEARDOWN
    # =========================================================================
    - name: "PHASE 9 | CHROOT | Bind peripheral API kernel filesystems into environment framework"
      ansible.builtin.command: "mount --bind {{ item.src }} /mnt/target{{ item.path }}"
      become: true
      loop:
        - { src: "/dev", path: "/dev" }
        - { src: "/dev/pts", path: "/dev/pts" }
        - { src: "/proc", path: "/proc" }
        - { src: "/sys", path: "/sys" }
      when: "not ansible_check_mode"

    - name: "PHASE 9 | CHROOT | Sync live network tracking configs"
      ansible.builtin.copy:
        src: "/etc/resolv.conf"
        dest: "/mnt/target/etc/resolv.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 9 | SYSTEM CONFIG | Populate static data layout tracking metrics (/etc/fstab)"
      ansible.builtin.copy:
        content: |
          # /etc/fstab: Static file system configuration definitions
          /dev/mapper/{{ os_crypt_name }}   /               btrfs   rw,{{ perf_mount_opts }},subvol={{ '@/.snapshots/1/snapshot' if ansible_facts['os_family'] == 'Suse' else 'root' if ansible_facts['os_family'] == 'RedHat' else '@rootfs' if ansible_facts['os_family'] == 'Debian' else '@' }} 0 0
          {% for sub in active_blueprint.subvolumes | sort(attribute='dest') %}
          {% if sub.dest != '/' %}
          /dev/mapper/{{ os_crypt_name }}   {{ sub.dest }}           btrfs   rw,{{ swap_mount_opts if sub.name == '@swap' or sub.name == 'swap' else perf_mount_opts }},subvol={{ sub.name }} 0 0
          {% endif %}
          {% endfor %}
          /swap/swapfile                   none            swap    defaults,pri=10,discard 0 0
          {% if is_fortress | bool %}
          {{ boot_partition }}              /boot           ext4    defaults,noatime 0 2
          {% endif %}
          {% if is_uefi | bool %}
          {{ esp_partition }}               /boot/efi       vfat    defaults,noatime 0 2
          {% endif %}
          {% if has_vault | bool %}
          /dev/mapper/{{ vault_crypt_name }} /vault          btrfs   rw,{{ perf_mount_opts }},subvol=@secure,noauto 0 0
          {% endif %}
        dest: "/mnt/target/etc/fstab"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 9 | SYSTEM CONFIG | Map target encryption unlock keys (/etc/crypttab)"
      ansible.builtin.copy:
        content: |
          # <target name> <source device> <key file> <options>
          {{ os_crypt_name }} UUID={{ os_partition_uuid.stdout | default('CHECK_MODE_STUB_UUID', true) }} none luks,discard
          {% if has_vault | bool %}
          {{ vault_crypt_name }} UUID={{ vault_uuid_raw.stdout | default('CHECK_MODE_STUB_VAULT_UUID', true) }} /etc/secure/vault.key luks,discard,noauto
          {% endif %}
        dest: "/mnt/target/etc/crypttab"
        owner: "root"
        group: "root"
        mode: "0440"
      become: true
      when: "not ansible_check_mode"
    - name: "PHASE 10 | CHROOT | Build configuration macros based on target profile architecture"
      ansible.builtin.set_fact:
        chroot_prefix: "{{ 'arch-chroot /mnt/target' if ansible_facts['os_family'] == 'Archlinux' else 'chroot /mnt/target' }}"

    - name: "PHASE 10 | SYSTEM SPECIFIC | Inject core identity and metadata parameters natively"
      ansible.builtin.shell: |
        echo "{{ target_hostname }}" > /mnt/target/etc/hostname
        {{ chroot_prefix }} ln -sf /usr/share/zoneinfo/{{ target_timezone }} /etc/localtime
        {{ chroot_prefix }} hwclock --systohc
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER | Execute core GRUB hardware environment injection maps"
      ansible.builtin.shell: "if [ '{{ is_uefi | bool }}' = 'true' ]; then {{ chroot_prefix }} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=GRUB --recheck; else {{ chroot_prefix }} grub-install --target=i386-pc {{ target_disk }} --recheck; fi"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER PASSWORD | Enforce restrictions on the plain boot text matrix"
      ansible.builtin.blockinfile:
        path: "/mnt/target/etc/grub.d/40_custom"
        marker: "# {mark} ANSIBLE BOOTLOADER PASSWORD BLOCK"
        block: |
          set superusers="root"
          password_pbkdf2 root {{ grub_admin_password }}
      become: true
      when: "not ansible_check_mode and is_fortress | bool"

    - name: "PHASE 10 | BOOTLOADER | Patch configuration variables to prompt for core security keys"
      ansible.builtin.blockinfile:
        path: "/mnt/target/etc/default/grub"
        marker: "# {mark} ANSIBLE SECURITY BOOT BLOCK"
        block: |
          {% if not (is_fortress | bool) %}
          GRUB_ENABLE_CRYPTODISK=y
          {% endif %}
          GRUB_CMDLINE_LINUX="cryptdevice=UUID={{ os_partition_uuid.stdout | default('CHECK_MODE_STUB_UUID', true) }}:{{ os_crypt_name }} root=/dev/mapper/{{ os_crypt_name }} rootfstype=btrfs rootflags=subvol={{ '@/.snapshots/1/snapshot' if ansible_facts['os_family'] == 'Suse' else 'root' if ansible_facts['os_family'] == 'RedHat' else '@rootfs' if ansible_facts['os_family'] == 'Debian' else '@' }} rw"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER HARDENING | Inject unrestricted flags into standard boot pathways"
      ansible.builtin.replace:
        path: "/mnt/target/etc/grub.d/10_linux"
        regexp: '^CLASS="--class gnu-linux --class gnu --class os"'
        replace: 'CLASS="--class gnu-linux --class gnu --class os --unrestricted"'
      become: true
      failed_when: false
      when: "not ansible_check_mode and is_fortress | bool"

    - name: "PHASE 10 | SNAPPER CONFIG | Align boot configuration lookup metrics"
      ansible.builtin.lineinfile:
        path: "/mnt/target/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_SNAPSHOTS_DIRS="
        line: 'GRUB_BTRFS_SNAPSHOTS_DIRS="/.snapshots"'
      become: true
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PHASE 10 | SNAPPER CRYPTO | Enforce container probe authentication permissions"
      ansible.builtin.lineinfile:
        path: "/mnt/target/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_ENABLE_CRYPTODISK="
        line: 'GRUB_BTRFS_ENABLE_CRYPTODISK="true"'
      become: true
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PHASE 10 | SNAPPER HARDENING | Bypass hardware probe block gates for encryption containers"
      ansible.builtin.lineinfile:
        path: "/mnt/target/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_SKIP_HARDWARE_CHECK="
        line: 'GRUB_BTRFS_SKIP_HARDWARE_CHECK="true"'
      become: true
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PHASE 10 | HOOKS | Ensure Arch Linux pacman hooks directory exists"
      ansible.builtin.file:
        path: "/mnt/target/etc/pacman.d/hooks"
        state: "directory"
        mode: "0755"
      become: true
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"

    - name: "PHASE 10 | HOOKS | Deploy Arch Linux Pre-Snapper Pacman Hook"
      ansible.builtin.copy:
        dest: "/mnt/target/etc/pacman.d/hooks/00-snapper-pre.hook"
        mode: "0644"
        content: |
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Operation = Remove
          Type = Package
          Target = *

          [Action]
          Description = [⚡ Snapper IaC Baseline] Executing pre-transaction system state recovery snapshot...
          When = PreTransaction
          Exec = /usr/bin/snapper -c root create -d "Pre-Transaction Snapshot via Pacman Trigger" -t pre
      become: true
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"

    - name: "PHASE 10 | HOOKS | Deploy Arch Linux Post-Snapper Pacman Hook"
      ansible.builtin.copy:
        dest: "/mnt/target/etc/pacman.d/hooks/zz-snapper-post.hook"
        mode: "0644"
        content: |
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Operation = Remove
          Type = Package
          Target = *

          [Action]
          Description = [✔ Snapper IaC Baseline] Executing post-transaction synchronization recovery snapshot...
          When = PostTransaction
          Exec = /usr/bin/snapper -c root create -d "Post-Transaction Snapshot via Pacman Trigger" -t post
      become: true
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"

    - name: "PHASE 10 | HOOKS | Deploy Debian APT Snapper Hook Configuration"
      ansible.builtin.copy:
        dest: "/mnt/target/etc/apt/apt.conf.d/80snapper"
        mode: "0644"
        content: |
          DPkg::Pre-Invoke {"echo '===========================================================================\n[⚡ Snapper IaC Baseline] Initializing system state backup snapshot...\n==========================================================================='; snapper -c root create -d 'Pre-APT Transaction' -t pre || true";};
          DPkg::Post-Invoke {"echo '===========================================================================\n[✔ Snapper IaC Baseline] final state synchronization snapshot complete.\n==========================================================================='; snapper -c root create -d 'Post-APT Transaction' -t post || true";};
      become: true
      when: "ansible_facts['os_family'] == 'Debian' and not ansible_check_mode"

    - name: "PHASE 10 | HOOKS | Install upstream DNF snapshot transaction extensions"
      ansible.builtin.shell: |
        {{ chroot_prefix }} dnf install -y python3-dnf-plugins-extras-snapper --nogpgcheck || true
        echo "plugins=1" >> /mnt/target/etc/dnf/dnf.conf || true
      become: true
      when: "ansible_facts['os_family'] == 'RedHat' and not ansible_check_mode"
    - name: "PHASE 10 | SYSTEM SERVICES | Enable system daemon loops natively"
      ansible.builtin.shell: |
        {{ chroot_prefix }} systemctl enable NetworkManager || true
        {{ chroot_prefix }} systemctl enable firewalld || true
        {{ chroot_prefix }} systemctl enable systemd-timesyncd || true
        {{ chroot_prefix }} systemctl enable tuned || true
        
        SYS_TYPE="{{ system_profile }}"

        if [ "$SYS_TYPE" = "laptop" ]; then
          {{ chroot_prefix }} systemctl enable bluetooth || true
          {{ chroot_prefix }} systemctl enable cups || true
          {{ chroot_prefix }} systemctl enable grub-btrfsd || true
          {{ chroot_prefix }} systemctl mask tuned || true
          if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
            {{ chroot_prefix }} systemctl mask power-profiles-daemon || true
            {{ chroot_prefix }} systemctl enable tlp || true
            sed -i 's/^#\?TLP_ENABLE=0/TLP_ENABLE=1/' /mnt/target/etc/tlp.conf || true
          else
            {{ chroot_prefix }} systemctl mask tlp || true
            {{ chroot_prefix }} systemctl enable power-profiles-daemon || true
          fi

        elif [ "$SYS_TYPE" = "desktop" ]; then
          {{ chroot_prefix }} systemctl enable bluetooth || true
          {{ chroot_prefix }} systemctl enable cups || true
          {{ chroot_prefix }} systemctl enable grub-btrfsd || true
          {{ chroot_prefix }} systemctl enable tuned || true
          {{ chroot_prefix }} systemctl mask tlp || true
          {{ chroot_prefix }} systemctl mask power-profiles-daemon || true
          echo "desktop" > /mnt/target/etc/tuned/active_profile || true

        else
          {{ chroot_prefix }} systemctl mask power-profiles-daemon || true
          {{ chroot_prefix }} systemctl mask tlp || true
          {{ chroot_prefix }} systemctl enable sshd || true
          {{ chroot_prefix }} systemctl enable tuned || true
          echo "throughput-performance" > /mnt/target/etc/tuned/active_profile || true
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | INITRAMFS | Inject crypto modules and compile runtime kernel image hooks"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          if ! grep -q "encrypt" /mnt/target/etc/mkinitcpio.conf; then
            sed -i 's/\(hooks\|HOOKS\)=(\([^)]*\)filesystems/\1=(\2encrypt btrfs filesystems/' /mnt/target/etc/mkinitcpio.conf
          fi
          {{ chroot_prefix }} mkinitcpio -P
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          mkdir -p /mnt/target/etc/cryptsetup-initramfs
          if ! grep -q "btrfs" /mnt/target/etc/initramfs-tools/modules; then echo "btrfs" >> /mnt/target/etc/initramfs-tools/modules; fi
          echo "CRYPTSETUP=y" >> /mnt/target/etc/cryptsetup-initramfs/conf-hook
          {{ chroot_prefix }} update-initramfs -u -k all
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          KVER=$(ls /mnt/target/lib/modules | head -n 1)
          {{ chroot_prefix }} dracut --force --add "crypt btrfs" --kver $KVER
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          KVER=$(ls /mnt/target/lib/modules | head -n 1)
          {{ chroot_prefix }} dracut --force --add "crypt btrfs" --kver $KVER
          {{ chroot_prefix }} update-bootloader --reinit
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER COMPILE | Write final changes to hardware boot sectors (Arch/Debian)"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ] || [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          {{ chroot_prefix }} grub-mkconfig -o /boot/grub/grub.cfg
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER COMPILE | Write final changes to hardware boot sectors (RedHat/Suse)"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "RedHat" ] || [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          {{ chroot_prefix }} grub-mkconfig -o /boot/efi/EFI/fedora/grub.cfg || {{ chroot_prefix }} grub-mkconfig -o /boot/grub2/grub.cfg
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | SNAPPER INITIALIZE | Setup baseline configuration space"
      ansible.builtin.shell: |
        if [ ! -f /mnt/target/etc/snapper/configs/root ]; then
          {{ chroot_prefix }} snapper -c root create-config / || true
        fi
      become: true
      when: "not ansible_check_mode"

    # =========================================================================
    # PHASE 11 & 12 | USER AND CLEANUP TARGET DEPLOYMENT PIPELINE
    # =========================================================================
    - name: "PHASE 11 | USER | Initialize system access groups"
      ansible.builtin.shell: "{{ chroot_prefix }} groupadd -g 1000 {{ target_username }} || true; {{ chroot_prefix }} useradd -u 1000 -g 1000 -m -G {{ admin_group }},audio,video,storage -s /bin/bash {{ target_username }} || true; echo 'root:{{ vault_root_password }}' | {{ chroot_prefix }} chpasswd; echo '{{ target_username }}:{{ vault_user_password }}' | {{ chroot_prefix }} chpasswd"
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 11 | VISUDO | Write privilege definitions with absolute syntax validation checks"
      ansible.builtin.copy:
        content: "{{ target_username }} ALL=(ALL:ALL) ALL"
        dest: "/mnt/target/etc/sudoers.d/{{ target_username }}"
        owner: "root"
        group: "root"
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 11.5 | ZRAM | Deploy optimized compressed memory configuration"
      ansible.builtin.copy:
        content: |
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = lz4
        dest: "/mnt/target/etc/systemd/zram-generator.conf"
        owner: "root"
