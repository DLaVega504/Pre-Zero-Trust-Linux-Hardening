# vars_mapping.yml
---
arch_vars:
  admin_group: "wheel"
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@portables", dest: "/var/lib/portables" }
    - { name: "@machines", dest: "/var/lib/machines" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@homesnapshots", dest: "/home/.snapshots" }
    - { name: "@cache", dest: "/var/cache/pacman/pkg" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@libvirt", dest: "/var/lib/libvirt/images" }
    - { name: "@srv", dest: "/srv" }

debian_vars:
  admin_group: "sudo"
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@portables", dest: "/var/lib/portables" }
    - { name: "@machines", dest: "/var/lib/machines" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@homesnapshots", dest: "/home/.snapshots" }
    - { name: "@cache", dest: "/var/cache/apt" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@libvirt", dest: "/var/lib/libvirt/images" }
    - { name: "@srv", dest: "/srv" }

fedora_vars:
  admin_group: "wheel"
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@portables", dest: "/var/lib/portables" }
    - { name: "@machines", dest: "/var/lib/machines" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@homesnapshots", dest: "/home/.snapshots" }
    - { name: "@cache", dest: "/var/cache/dnf" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@libvirt", dest: "/var/lib/libvirt/images" }
    - { name: "@srv", dest: "/srv" }

suse_vars:
  admin_group: "wheel"
  subvolumes:
    - { name: "@", dest: "/.snapshots/1/snapshot" } 
    - { name: "@home", dest: "/home" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@portables", dest: "/var/lib/portables" }
    - { name: "@machines", dest: "/var/lib/machines" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@homesnapshots", dest: "/home/.snapshots" }
    - { name: "@cache", dest: "/var/cache/zypp" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@libvirt", dest: "/var/lib/libvirt/images" }
    - { name: "@srv", dest: "/srv" }

