---
- name: "Universal Interactive Turn-Key Linux Pre-Hardening Framework (Stage 1)"
  hosts: "localhost"
  connection: "local"
  become: false
  gather_facts: true

  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    swap_mount_opts: "noatime,space_cache=v2,nodatacow"
    
    target_disk: "{{ disk_prompt.user_input | default('/dev/sda', true) }}"
    vault_size_input: "{{ vault_size_prompt.user_input | default('50', true) }}"
    os_passphrase: "{{ os_pass_prompt.user_input | default('', true) }}"
    vault_passphrase: "{{ vault_pass_prompt.user_input | default('', true) }}"
    vault_root_password: "{{ root_pass_prompt.user_input | default('', true) }}"
    target_username: "{{ user_prompt.user_input | default('vega', true) }}"
    vault_user_password: "{{ user_pass_prompt.user_input | default('', true) }}"

  tasks:
    - name: "PHASE 1 | PROMPT | Gather target disk selection"
      ansible.builtin.pause:
        prompt: "[?] Enter absolute block device target to partition (e.g., /dev/sda)"
      register: disk_prompt

    - name: "PHASE 1 | PROMPT | Gather secure vault sizing metrics"
      ansible.builtin.pause:
        prompt: "Enter the size for the Vault partition in GB (5 to 60, or enter 0 to SKIP) [Default: 50]"
      register: vault_size_prompt

    - name: "PHASE 1 | PROMPT | Gather Main OS Passphrase"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Main OS Partition (Typed at boot)"
        echo: false
      register: os_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather Vault Passphrase"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Secure Vault Partition (Bypassed if size is 0)"
        echo: false
      register: vault_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather ROOT Administrative Password"
      ansible.builtin.pause:
        prompt: "Enter System Administrative ROOT Password"
        echo: false
      register: root_pass_prompt

    - name: "PHASE 1 | PROMPT | Gather Account Username"
      ansible.builtin.pause:
        prompt: "[?] Enter account username for regular user [vega]"
      register: user_prompt

    - name: "PHASE 1 | PROMPT | Gather Account Password"
      ansible.builtin.pause:
        prompt: "Enter the account password for the regular user"
        echo: false
      register: user_pass_prompt

    - name: "PHASE 2 | VALIDATION | Ensure Vault size constraints match architecture rules"
      ansible.builtin.assert:
        that:
          - "vault_size_input | int == 0 or (vault_size_input | int >= 5 and vault_size_input | int <= 60)"
        msg: "FATAL ERROR: Vault size must be 0 or specified between 5 and 60 GB max."
    - name: "PHASE 2 | RECON | Validate targeted installation disk path exists on system"
      ansible.builtin.stat:
        path: "{{ target_disk }}"
      register: disk_verify
      failed_when: "not disk_verify.stat.exists or not disk_verify.stat.isblk"

    - name: "PHASE 2 | RECON | Detect active motherboard boot firmware schema"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_check

    - name: "PHASE 2 | RECON | Map environment path layout syntax strings"
      ansible.builtin.set_fact:
        is_uefi: "{{ efi_check.stat.exists }}"
        p_suffix: "{{ 'p' if 'nvme' in target_disk else '' }}"
        is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
        has_vault: "{{ vault_size_input | int > 0 }}"

    - name: "PHASE 2 | RECON | Compute adaptive swap footprint requirements"
      ansible.builtin.set_fact:
        stage1_swap_mb: >-
          {{
            4096 if not (is_workstation | bool) else
            (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
            (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
            4096
          }}

    - name: "PHASE 2 | STORAGE | Ingest multi-distribution subvolume blueprints"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "PHASE 2 | RECON | Select subvolume blueprint matrix based on host distribution"
      ansible.builtin.set_fact:
        active_blueprint: "{{ distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else distro_blueprint.suse_vars }}"
        admin_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

    - name: "PHASE 3 | STORAGE | Clear system partition records and write clean target maps"
      ansible.builtin.shell: |
        wipefs -a --force {{ target_disk }}
        sgdisk --zap-all {{ target_disk }}
        
        if [ "{{ is_uefi | bool }}" = "true" ]; then
          parted -s {{ target_disk }} mklabel gpt
          parted -s {{ target_disk }} mkpart ESP fat32 1MiB 1025MiB
          parted -s {{ target_disk }} set 1 boot on
          if [ "{{ has_vault | bool }}" = "true" ]; then
            parted -s {{ target_disk }} mkpart primary btrfs 1025MiB -{{ vault_size_input }}GiB
            parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
          else
            parted -s {{ target_disk }} mkpart primary btrfs 1025MiB 100%
          fi
        else
          parted -s {{ target_disk }} mklabel msdos
          if [ "{{ has_vault | bool }}" = "true" ]; then
            parted -s {{ target_disk }} mkpart primary btrfs 1MiB -{{ vault_size_input }}GiB
            parted -s {{ target_disk }} mkpart primary btrfs -{{ vault_size_input }}GiB 100%
          else
            parted -s {{ target_disk }} mkpart primary btrfs 1MiB 100%
          fi
          parted -s {{ target_disk }} set 1 boot on
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 3 | LUKS | Map active logical disk workspace index structures"
      ansible.builtin.set_fact:
        esp_partition: "{{ target_disk }}{{ p_suffix }}1"
        os_partition: "{{ (target_disk + p_suffix + '2') if (is_uefi | bool) else (target_disk + p_suffix + '1') }}"
        vault_partition: "{{ (target_disk + p_suffix + '3') if (is_uefi | bool) else (target_disk + p_suffix + '2') if has_vault | bool else 'none' }}"
    - name: "PHASE 4 | LUKS | Establish secure container volume over Main OS workspace"
      ansible.builtin.shell: "echo '{{ os_passphrase }}' | cryptsetup luksFormat --type luks1 --batch-mode {{ os_partition }}"
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 4 | LUKS | Map early unlocked kernel channel endpoint descriptor"
      ansible.builtin.shell: "echo '{{ os_passphrase }}' | cryptsetup open {{ os_partition }} {{ os_crypt_name }}"
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 4 | LUKS | Extract live machine storage hardware UUID tracking strings"
      ansible.builtin.command: "blkid -s UUID -o value {{ os_partition }}"
      register: os_partition_uuid
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | BTRFS | Initialize structural platform filesystem pool"
      ansible.builtin.filesystem:
        fstype: "btrfs"
        dev: "/dev/mapper/{{ os_crypt_name }}"
        force: true
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Attach transient master pool mount hook"
      ansible.builtin.command: "mount /dev/mapper/{{ os_crypt_name }} /mnt"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Carve out full 13-subvolume architecture allocations"
      ansible.builtin.command: "btrfs subvolume create /mnt/{{ item.name }}"
      loop: "{{ active_blueprint.subvolumes }}"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | openSUSE SPECIFIC | Instantiate internal Snapper snapshot chamber"
      ansible.builtin.shell: |
        mkdir -p /mnt/@/.snapshots/1
        btrfs subvolume create /mnt/@/.snapshots/1/snapshot
      become: true
      when:
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Dismount master pool to lock storage layout parameters"
      ansible.builtin.command: "umount /mnt"
      become: true
      failed_when: false
      when: "not ansible_check_mode"
    - name: "PHASE 5 | STORAGE | Enforce target deployment folder structures"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "0755"
      loop: [ '/mnt/target', '/mnt/target/boot' ]
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Mount active base root subvolume framework layer"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          mount -o rw,{{ perf_mount_opts }},subvol=@/.snapshots/1/snapshot /dev/mapper/{{ os_crypt_name }} /mnt/target
        else
          mount -o rw,{{ perf_mount_opts }},subvol=@ /dev/mapper/{{ os_crypt_name }} /mnt/target
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 5 | STORAGE | Sequentially structure inner parent system path folders"
      ansible.builtin.file:
        path: "/mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
        state: "directory"
        mode: "0755"
      loop: "{{ active_blueprint.subvolumes }}"
      when: 
        - "not ansible_check_mode"
        - "item.dest != '/'"

    - name: "PHASE 5 | STORAGE | Securely bind remaining 12 subvolumes to distribution-specific paths"
      ansible.builtin.command: "mount -o rw,{{ swap_mount_opts if item.name == '@swap' else perf_mount_opts }},subvol={{ item.name }} /dev/mapper/{{ os_crypt_name }} /mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
      loop: "{{ active_blueprint.subvolumes }}"
      when: 
        - "not ansible_check_mode"
        - "item.dest != '/'"

    - name: "PHASE 5 | STORAGE | Format and mount structural UEFI boot partition (ESP)"
      ansible.builtin.shell: |
        if [ "{{ is_uefi | bool }}" = "true" ]; then
          mkfs.vfat -F32 {{ esp_partition }}
          mkdir -p /mnt/target/boot/efi
          mount {{ esp_partition }} /mnt/target/boot/efi
        else
          echo "Legacy BIOS: /boot resides safely inside encrypted loop root."
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Create zero-byte footprint file mapping within isolated path"
      ansible.builtin.file:
        path: "/mnt/target/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Enforce absolute Copy-on-Write exemption on empty mapping"
      ansible.builtin.command: "chattr +C /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Explicitly strip compression processing calls"
      ansible.builtin.command: "btrfs property set /mnt/target/swap/swapfile compression none"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Hydrate actual bit blocks based on adaptive system memory footprints"
      ansible.builtin.command: "dd if=/dev/zero of=/mnt/target/swap/swapfile bs=1M count={{ stage1_swap_mb }} status=progress"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Frame valid swap header signatures onto built mapping"
      ansible.builtin.command: "mkswap /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 6 | STORAGE | Turn on swap to verify operational performance limits"
      ansible.builtin.command: "swapon /mnt/target/swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 7 | BOOTSTRAP | Install foundational system tools"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          pacstrap /mnt/target {{ active_blueprint.bootstrap_packages }}
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          debootstrap --include={{ active_blueprint.bootstrap_packages }} stable /mnt/target http://debian.org
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          dnf --installroot=/mnt/target --releasever=40 groupinstall -y "Minimal Install" "Xfce Desktop" --include={{ active_blueprint.bootstrap_packages }}
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          zypper --root /mnt/target install -y --no-recommends -t pattern base xfce {{ active_blueprint.bootstrap_packages }}
        fi
      become: true
      when: "not ansible_check_mode"
    - name: "PHASE 8 | VAULT | Form enterprise LUKS2 container using primary Argon2id algorithms"
      ansible.builtin.shell: "echo '{{ vault_passphrase }}' | cryptsetup luksFormat --type luks2 --pbkdf argon2id --batch-mode {{ vault_partition }}"
      become: true
      no_log: true
      when: "not ansible_check_mode and has_vault | bool"

    - name: "PHASE 8 | VAULT | Ensure secure encryption key storage directory exists"
      ansible.builtin.file:
        path: "/mnt/target/etc/secure"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0700"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Generate a random 32-byte cryptographically secure system vault key"
      ansible.builtin.command: "dd if=/dev/urandom of=/mnt/target/etc/secure/vault.key bs=1 count=32"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Lock system keyfile signatures strictly to root privileges"
      ansible.builtin.file:
        path: "/mnt/target/etc/secure/vault.key"
        owner: "root"
        group: "root"
        mode: "0400"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Inject the generated system keyfile into secondary slot of vault partition"
      ansible.builtin.shell: "echo '{{ vault_passphrase }}' | cryptsetup luksAddKey --batch-mode {{ vault_partition }} /mnt/target/etc/secure/vault.key"
      become: true
      no_log: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Unlock vault mapper channel utilizing the newly registered system keyfile"
      ansible.builtin.command: "cryptsetup open {{ vault_partition }} {{ vault_crypt_name }} --key-file /mnt/target/etc/secure/vault.key"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Extract the hardware UUID parameter block from vault partition"
      ansible.builtin.command: "blkid -s UUID -o value {{ vault_partition }}"
      register: "vault_uuid_raw"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Format the exposed vault target mapped space as clean BTRFS storage"
      ansible.builtin.filesystem:
        fstype: "btrfs"
        dev: "/dev/mapper/{{ vault_crypt_name }}"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Pre-carve required Btrfs secure vault container subvolume hierarchy"
      ansible.builtin.shell: |
        mkdir -p /mnt/@vault_holder_tmp
        mount /dev/mapper/{{ vault_crypt_name }} /mnt/@vault_holder_tmp
        btrfs subvolume create /mnt/@vault_holder_tmp/@secure
        umount /mnt/@vault_holder_tmp
        rm -rf /mnt/@vault_holder_tmp
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 8 | VAULT | Securely close the open device mapping to clear tracking descriptors from active RAM"
      ansible.builtin.command: "cryptsetup close {{ vault_crypt_name }}"
      become: true
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"

    - name: "PHASE 9 | CHROOT | Bind peripheral API kernel filesystems into environment framework"
      ansible.builtin.command: "mount --bind {{ item.src }} /mnt/target{{ item.path }}"
      become: true
      loop:
        - { src: "/dev", path: "/dev" }
        - { src: "/dev/pts", path: "/dev/pts" }
        - { src: "/proc", path: "/proc" }
        - { src: "/sys", path: "/sys" }
      when: "not ansible_check_mode"

    - name: "PHASE 9 | CHROOT | Sync live network tracking configs"
      ansible.builtin.copy:
        src: "/etc/resolv.conf"
        dest: "/mnt/target/etc/resolv.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 9 | SYSTEM CONFIG | Populate static data layout tracking metrics (/etc/fstab)"
      ansible.builtin.copy:
        content: |
          # /etc/fstab: Static file system configuration definitions
          /dev/mapper/{{ os_crypt_name }}   /               btrfs   rw,{{ perf_mount_opts }},subvol={{ '@/.snapshots/1/snapshot' if ansible_facts['os_family'] == 'Suse' else '@' }} 0 0
          {% for sub in active_blueprint.subvolumes %}
          {% if sub.dest != '/' %}
          /dev/mapper/{{ os_crypt_name }}   {{ sub.dest }}           btrfs   rw,{{ swap_mount_opts if sub.name == '@swap' else perf_mount_opts }},subvol={{ sub.name }} 0 0
          {% endif %}
          {% endfor %}
          /swap/swapfile                   none            swap    defaults,pri=10 0 0
          {% if is_uefi | bool %}
          {{ esp_partition }}               /boot/efi       vfat    defaults,noatime 0 2
          {% endif %}
          {% if has_vault | bool %}
          /dev/mapper/{{ vault_crypt_name }} /vault          btrfs   rw,{{ perf_mount_opts }},subvol=@secure,noauto 0 0
          {% endif %}
        dest: "/mnt/target/etc/fstab"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 9 | SYSTEM CONFIG | Map target encryption unlock keys (/etc/crypttab)"
      ansible.builtin.copy:
        content: |
          # <target name> <source device> <key file> <options>
          {{ os_crypt_name }} UUID={{ os_partition_uuid.stdout | default('CHECK_MODE_STUB_UUID', true) }} none luks,discard
          {% if has_vault | bool %}
          {{ vault_crypt_name }} UUID={{ vault_uuid_raw.stdout | default('CHECK_MODE_STUB_VAULT_UUID', true) }} /etc/secure/vault.key luks,discard,noauto
          {% endif %}
        dest: "/mnt/target/etc/crypttab"
        owner: "root"
        group: "root"
        mode: "0440"
      become: true
      when: "not ansible_check_mode"
    - name: "PHASE 10 | CHROOT | Build configuration macros based on target profile architecture"
      ansible.builtin.set_fact:
        chroot_prefix: "{{ 'arch-chroot /mnt/target' if ansible_facts['os_family'] == 'Archlinux' else 'chroot /mnt/target' }}"

    - name: "PHASE 10 | KERNEL | Explicitly force core distribution kernel compilation inside clean environments"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          {{ chroot_prefix }} apt-get update
          {{ chroot_prefix }} apt-get install -y linux-image-amd64 linux-headers-amd64
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          {{ chroot_prefix }} zypper install -y kernel-default
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER | Execute core GRUB hardware environment injection maps"
      ansible.builtin.shell: |
        if [ "{{ is_uefi | bool }}" = "true" ]; then
          {{ chroot_prefix }} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=GRUB --recheck
        else
          {{ chroot_prefix }} grub-install --target=i386-pc {{ target_disk }} --recheck
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER | Patch configuration variables to prompt for core security keys"
      ansible.builtin.blockinfile:
        path: "/mnt/target/etc/default/grub"
        marker: "# {mark} ANSIBLE SECURITY BOOT BLOCK"
        block: |
          GRUB_ENABLE_CRYPTODISK=y
          GRUB_CMDLINE_LINUX="cryptdevice=UUID={{ os_partition_uuid.stdout | default('CHECK_MODE_STUB_UUID', true) }}:{{ os_crypt_name }} root=/dev/mapper/{{ os_crypt_name }} rootfstype=btrfs rootflags=subvol={{ '@/.snapshots/1/snapshot' if ansible_facts['os_family'] == 'Suse' else '@' }} rw"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | INITRAMFS | Inject crypto modules and compile runtime kernel image hooks"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          if ! grep -q "encrypt" /mnt/target/etc/mkinitcpio.conf; then
            sed -i 's/\(hooks\|HOOKS\)=(\([^)]*\)filesystems/\1=(\2encrypt btrfs filesystems/' /mnt/target/etc/mkinitcpio.conf
          fi
          {{ chroot_prefix }} {{ active_blueprint.initramfs_cmd }}
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          if ! grep -q "btrfs" /mnt/target/etc/initramfs-tools/modules; then
            echo "btrfs" >> /mnt/target/etc/initramfs-tools/modules
          fi
          echo "CRYPTSETUP=y" >> /mnt/target/etc/cryptsetup-initramfs/conf-hook
          {{ chroot_prefix }} {{ active_blueprint.initramfs_cmd }}
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          KVER=$({{ chroot_prefix }} rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel | head -n 1)
          {{ chroot_prefix }} dracut --force --kver $KVER
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          KVER=$({{ chroot_prefix }} rpm -q --queryformat '%{VERSION}-%{RELEASE}-default\n' kernel-default | head -n 1)
          {{ chroot_prefix }} dracut --force --kver $KVER
          {{ chroot_prefix }} update-bootloader --reinit
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | SNAPPER | Initialize isolated recovery configuration tables"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" != "Suse" ]; then
          rm -rf /mnt/target/.snapshots
          {{ chroot_prefix }} snapper -c root create-config /
          {{ chroot_prefix }} btrfs subvolume delete /.snapshots || true
          mkdir -p /mnt/target/.snapshots
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 11 | USER | Initialize system access groups"
      ansible.builtin.shell: |
        {{ chroot_prefix }} groupadd -g 1000 {{ target_username }} || true
        {{ chroot_prefix }} useradd -u 1000 -g 1000 -m -G {{ active_blueprint.admin_group }},audio,video,storage -s /bin/bash {{ target_username }} || true
        echo "root:{{ vault_root_password }}" | {{ chroot_prefix }} chpasswd
        echo "{{ target_username }}:{{ vault_user_password }}" | {{ chroot_prefix }} chpasswd
      become: true
      no_log: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | SNAPPER | Build and install the Grub-Btrfs background menu updater daemon"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          {{ chroot_prefix }} git clone https://github.com /tmp/grub-btrfs
          {{ chroot_prefix }} chmod 777 /tmp/grub-btrfs
          cd /mnt/target/tmp/grub-btrfs && {{ chroot_prefix }} runuser -l {{ target_username }} -c "cd /tmp/grub-btrfs && makepkg -si --noconfirm"
          {{ chroot_prefix }} systemctl enable --now grub-btrfsd
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          {{ chroot_prefix }} git clone https://github.com /tmp/grub-btrfs
          cd /mnt/target/tmp/grub-btrfs && {{ chroot_prefix }} make install
          {{ chroot_prefix }} systemctl enable --now grub-btrfsd
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          {{ chroot_prefix }} git clone https://github.com /tmp/grub-btrfs
          cd /mnt/target/tmp/grub-btrfs && {{ chroot_prefix }} make install
          {{ chroot_prefix }} systemctl enable --now grub-btrfsd
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          {{ chroot_prefix }} systemctl enable --now snapper-timeline.timer snapper-cleanup.timer
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 10 | BOOTLOADER | Compile clean final operational system boot records"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "RedHat" ] && [ "{{ is_uefi | bool }}" = "true" ]; then
          {{ chroot_prefix }} grub2-mkconfig -o /boot/efi/EFI/fedora/grub.cfg
        elif [ -f "/mnt/target/boot/grub/grub.cfg" ]; then
          {{ chroot_prefix }} grub-mkconfig -o /boot/grub/grub.cfg
        else
          {{ chroot_prefix }} grub2-mkconfig -o /boot/grub2/grub.cfg
        fi
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 11 | VISUDO | Write clean privilege definitions with absolute syntax validation checks"
      ansible.builtin.copy:
        content: "{{ target_username }} ALL=(ALL:ALL) ALL"
        dest: "/mnt/target/etc/sudoers.d/{{ target_username }}"
        owner: "root"
        group: "root"
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
      when: "not ansible_check_mode"

    - name: "PHASE 12 | CLEANUP | Safely disconnect virtual operating system paths"
      ansible.builtin.shell: |
        umount -l /mnt/target/dev/pts || true
        umount -l /mnt/target/dev || true
        umount -l /mnt/target/proc || true
        umount -l /mnt/target/sys || true
        swapoff /mnt/target/swap/swapfile || true
        umount -R /mnt/target || true
      become: true
      failed_when: false
      when: "not ansible_check_mode"

