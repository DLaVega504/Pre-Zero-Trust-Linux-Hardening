---
- name: "Universal Interactive Turn-Key Linux Pre-Hardening Framework (Stage 1)"
  hosts: "localhost"
  connection: "local"
  become: true
  gather_facts: true

  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    swap_mount_opts: "noatime,space_cache=v2,nodatacow"
    
    target_disk: "{{ disk_prompt.user_input | default('/dev/sda', true) }}"
    vault_size_input: "{{ vault_size_prompt.user_input | default('50', true) }}"
    os_passphrase: "{{ os_pass_prompt.user_input | default('', true) }}"
    vault_passphrase: "{{ vault_pass_prompt.user_input | default('', true) }}"
    vault_root_password: "{{ root_pass_prompt.user_input | default('', true) }}"
    target_username: "{{ user_prompt.user_input | default('vega', true) }}"
    vault_user_password: "{{ user_pass_prompt.user_input | default('', true) }}"

  tasks:
    - name: "PROMPT | Gather target disk selection"
      ansible.builtin.pause:
        prompt: "[?] Enter absolute block device target to partition (e.g., /dev/sda)"
      register: disk_prompt

    - name: "PROMPT | Gather secure vault sizing metrics"
      ansible.builtin.pause:
        prompt: "Enter the size for the Vault partition in GB (5 to 60, or enter 0 to SKIP the vault entirely) [Default: 50]"
      register: vault_size_prompt

    - name: "PROMPT | Gather Main OS Passphrase"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Main OS Partition (Typed at boot)"
        echo: false
      register: os_pass_prompt

    - name: "PROMPT | Gather Vault Passphrase"
      ansible.builtin.pause:
        prompt: "Enter Master Passphrase for Secure Vault Partition (Bypassed if size is 0)"
        echo: false
      register: vault_pass_prompt

    - name: "PROMPT | Gather ROOT Administrative Password"
      ansible.builtin.pause:
        prompt: "Enter System Administrative ROOT Password"
        echo: false
      register: root_pass_prompt

    - name: "PROMPT | Gather Account Username"
      ansible.builtin.pause:
        prompt: "Enter the account username for the primary regular user [vega]"
      register: user_prompt

    - name: "PROMPT | Gather Account Password"
      ansible.builtin.pause:
        prompt: "Enter the account password for the regular user"
        echo: false
      register: user_pass_prompt
    # =========================================================================
    # PHASE 2: TELEMETRY & HARDWARE FOOTPRINT RECON
    # =========================================================================
    - name: "VALIDATION | Ensure Vault size constraints match architecture rules"
      ansible.builtin.assert:
        that:
          - "vault_size_input | int == 0 or (vault_size_input | int >= 5 and vault_size_input | int <= 60)"
        msg: "FATAL ERROR: Vault size must be 0 (to skip) or specified between 5 and 60 GB max."

    - name: "RECON | Validate targeted installation disk path exists on system"
      ansible.builtin.stat:
        path: "{{ target_disk }}"
      register: disk_verify
      failed_when: "not disk_verify.stat.exists or not disk_verify.stat.isblk"

    - name: "RECON | Detect active motherboard boot firmware schema"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_check

    - name: "RECON | Map environment path layout syntax strings"
      ansible.builtin.set_fact:
        is_uefi: "{{ efi_check.stat.exists }}"
        p_suffix: "{{ 'p' if 'nvme' in target_disk else '' }}"
        is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
        has_vault: "{{ vault_size_input | int > 0 }}"

    - name: "RECON | Compute adaptive raw physical storage allocations"
      ansible.builtin.set_fact:
        stage1_swap_mb: >-
          {{
            4096 if not (is_workstation | bool) else
            (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
            (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
            4096
          }}

    - name: "Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "RECON | Map host platform operational security variables for Arch Linux"
      ansible.builtin.set_fact:
        target_blueprint: "{{ distro_blueprint.arch_vars }}"
        admin_group: "wheel"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "RECON | Map host platform operational security variables for Debian"
      ansible.builtin.set_fact:
        target_blueprint: "{{ distro_blueprint.debian_vars }}"
        admin_group: "sudo"
      when: "ansible_facts['os_family'] == 'Debian'"

    - name: "RECON | Map host platform operational security variables for Fedora (RedHat)"
      ansible.builtin.set_fact:
        target_blueprint: "{{ distro_blueprint.fedora_vars }}"
        admin_group: "wheel"
      when: "ansible_facts['os_family'] == 'RedHat'"

    - name: "RECON | Map host platform operational security variables for openSUSE (Suse)"
      ansible.builtin.set_fact:
        target_blueprint: "{{ distro_blueprint.suse_vars }}"
        admin_group: "wheel"
      when: "ansible_facts['os_family'] == 'Suse'"
    # =========================================================================
    # PHASE 3: UNIVERSAL STORAGE WIPING & GEOMETRY ALLOCATION
    # =========================================================================
    - name: "LOGGING | Output calculated storage schema boundaries"
      ansible.builtin.debug:
        msg: 
          - "Identified Block Storage Device Target: {{ target_disk }}"
          - "System Boot Mode Infrastructure: {{ 'UEFI Boot Matrix' if is_uefi | bool else 'Legacy BIOS Mode (MBR enforced)' }}"
          - "Calculated Dynamic Swap Target Path Size: {{ stage1_swap_mb }} MB"
          - "Isolated Secure Vault Partition Deployment Status: {{ 'ENABLED (' + vault_size_input + ' GB)' if has_vault | bool else 'DISABLED' }}"

    - name: "STORAGE | Clear storage tables and write clean partition layouts"
      ansible.builtin.shell: |
        wipefs -a --force {{ target_disk }}
        sgdisk --zap-all {{ target_disk }}
        
        if [ "{{ is_uefi | bool }}" = "true" ]; then
          parted -s {{ target_disk }} mklabel gpt
          parted -s {{ target_disk }} mkpart ESP fat32 1MiB 1025MiB
          parted -s {{ target_disk }} set 1 boot on
          if [ "{{ has_vault | bool }}" = "true" ]; then
            parted -s {{ target_disk }} mkpart primary btrfs 1025MiB -{{ vault_size_input }}GiB
            parted -s {{ target_disk }} mkpart primary ext4 -{{ vault_size_input }}GiB 100%
          else
            parted -s {{ target_disk }} mkpart primary btrfs 1025MiB 100%
          fi
        else
          if [ "{{ has_vault | bool }}" = "true" ]; then
            echo -e "o\nn\np\n2\n\n+{{ vault_size_input }}G\nn\np\n1\n\n\na\n1\nw" | fdisk {{ target_disk }}
          else
            echo -e "o\nn\np\n1\n\n\na\n1\nw" | fdisk {{ target_disk }}
          fi
        fi
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 5: BTRFS STORAGE POOL INITIALIZATION
    # =========================================================================
    - name: "BTRFS | Format unlocked primary mapper volume layout as clean Btrfs"
      ansible.builtin.filesystem:
        fstype: "btrfs"
        dev: "/dev/mapper/{{ os_crypt_name }}"
        force: true
      when: "not ansible_check_mode"

    - name: "STORAGE | Mount top-level Btrfs root pool (ID 5) to temporary staging area"
      ansible.builtin.command: "mount /dev/mapper/{{ os_crypt_name }} /mnt"
      register: temp_pool_mount
      failed_when: "temp_pool_mount.rc != 0 and 'already mounted' not in temp_pool_mount.stderr"
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 6: BTRFS TREE ARCHITECTURE GENERATION
    # =========================================================================
    - name: "STORAGE | Dynamically carve required distribution subvolume nodes on ID 5 root tree"
      ansible.builtin.command: "btrfs subvolume create /mnt/{{ item.name }}"
      loop: "{{ target_blueprint.subvolumes_map | default(distro_blueprint.arch_vars.subvolumes_map, true) }}"
      when: "not ansible_check_mode"

    - name: "STORAGE | Unmount temporary top-level Btrfs pool to secure state"
      ansible.builtin.command: "umount /mnt"
      failed_when: false
      when: "not ansible_check_mode"

    - name: "STORAGE | Mount newly carved OS root subvolume chamber to master target"
      ansible.builtin.command: "mount -o rw,{{ perf_mount_opts }},subvol=@ /dev/mapper/{{ os_crypt_name }} /mnt/target"
      when: "not ansible_check_mode"

    - name: "STORAGE | Map physical directory system nodes onto target subvolume layout"
      ansible.builtin.file:
        path: "/mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
        state: "directory"
        mode: "0755"
      loop: "{{ target_blueprint.subvolumes_map | default(distro_blueprint.arch_vars.subvolumes_map, true) }}"
      when: 
        - "not ansible_check_mode"
        - "item.dest != '/'"

    - name: "STORAGE | Mount remaining subvolume chambers into their respective targets"
      ansible.builtin.command: "mount -o rw,{{ perf_mount_opts }},subvol={{ item.name }} /dev/mapper/{{ os_crypt_name }} /mnt/target/{{ item.dest | regex_replace('^/+', '') }}"
      loop: "{{ target_blueprint.subvolumes_map | default(distro_blueprint.arch_vars.subvolumes_map, true) }}"
      when: 
        - "not ansible_check_mode"
        - "item.dest != '/' and item.dest != '/swap'"
    # =========================================================================
    # PHASE 7: BTRFS SUBVOLUME-ISOLATED SWAP GENERATION
    # =========================================================================
    - name: "STORAGE | Mount dedicated swap subvolume chamber safely"
      ansible.builtin.command: "mount -o rw,{{ swap_mount_opts }},subvol=@swap /dev/mapper/{{ os_crypt_name }} /mnt/target/swap"
      when: "not ansible_check_mode"

    - name: "STORAGE | Allocate empty block container for swapfile inside isolated path"
      ansible.builtin.file:
        path: "/mnt/target/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"

    - name: "STORAGE | Disable Copy-on-Write (CoW) metrics on subvolume swapfile"
      ansible.builtin.command: "chattr +C /mnt/target/swap/swapfile"
      when: "not ansible_check_mode"

    - name: "STORAGE | Disable Btrfs compression metrics explicitly on swapfile"
      ansible.builtin.command: "btrfs property set /mnt/target/swap/swapfile compression none"
      when: "not ansible_check_mode"

    - name: "STORAGE | Fill real system data allocations for adaptive swap size"
      ansible.builtin.command: "dd if=/dev/zero of=/mnt/target/swap/swapfile bs=1M count={{ stage1_swap_mb }}"
      when: "not ansible_check_mode"

    - name: "STORAGE | Format subvolume swap file tracking signatures"
      ansible.builtin.command: "mkswap /mnt/target/swap/swapfile"
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 8: DISTRIBUTION SUBVOLUME BOOTSTRAPPING MODULES
    # =========================================================================
    - name: "BOOTSTRAP | Execute Base OS Environment Image Provisioning (Arch Linux Module)"
      ansible.builtin.command: pacstrap -K /mnt/target base base-devel linux linux-lts linux-hardened linux-firmware btrfs-progs cryptsetup grub-btrfs snapper tuned intel-ucode xorg-server xfce4 xfce4-goodies lightdm lightdm-gtk-greeter lightdm-gtk-greeter-settings firewalld bluez bluez-utils pipewire pipewire-pulse pipewire-alsa pipewire-jack nano vi vim
      when: 
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: "BOOTSTRAP | Execute Base OS Environment Image Provisioning (Debian Module)"
      block:
        - name: Deploy Debootstrap utility onto host runner context
          ansible.builtin.package:
            name: debootstrap
            state: present
        - name: Pull clean core image layers onto targeted root structure
          ansible.builtin.command: debootstrap --include=btrfs-progs,cryptsetup,snapper,grub-pc,lightdm,xfce4,firewalld,bluez,pipewire,tuned,vim stable /mnt/target http://debian.org
      when: 
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "BOOTSTRAP | Execute Base OS Environment Image Provisioning (Fedora Module)"
      ansible.builtin.command: dnf --installroot=/mnt/target --releasever=40 groupinstall -y "Minimal Install" "Xfce Desktop" --skip-broken --setopt=install_weak_deps=False --include=btrfs-progs,cryptsetup,snapper,grub2-efi,lightdm,firewalld,bluez,pipewire,tuned,vim
      when: 
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"

    - name: "BOOTSTRAP | Execute Base OS Environment Image Provisioning (openSUSE Module)"
      ansible.builtin.command: zypper --root /mnt/target install -y --no-recommends patterns-base-base_system patterns-xfce-xfce btrfs-progs cryptsetup kernel-default snapper grub2 lightdm firewalld bluez pipewire tuned vim
      when: 
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"
    # =========================================================================
    # PHASE 10: CHROOT SYSTEMS INTERFACES & RUNTIME DNS
    # =========================================================================
    - name: Bind essential virtual API kernel filesystems into the target node workspace
      ansible.builtin.command: "mount --bind {{ item.src }} /mnt/target{{ item.path }}"
      loop:
        - { src: "/dev", path: "/dev" }
        - { src: "/dev/pts", path: "/dev/pts" }
        - { src: "/proc", path: "/proc" }
        - { src: "/sys", path: "/sys" }
      when: "not ansible_check_mode"

    - name: Copy host DNS configuration to prevent chroot network mirror failures
      ansible.builtin.copy:
        src: "/etc/resolv.conf"
        dest: "/mnt/target/etc/resolv.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "not ansible_check_mode"

    - name: "SYSTEM CONFIG | Dynamically forge file system runtime fstab layout ledger table"
      ansible.builtin.copy:
        content: |
          # /etc/fstab: Static file system information (Initial Subvolume Framework)
          /dev/mapper/{{ os_crypt_name }}   /               btrfs   rw,{{ perf_mount_opts }},subvol=@ 0 0
          /dev/mapper/{{ os_crypt_name }}   /home           btrfs   rw,{{ perf_mount_opts }},subvol=@home 0 0
          /dev/mapper/{{ os_crypt_name }}   /swap           btrfs   rw,{{ swap_mount_opts }},subvol=@swap 0 0
          /swap/swapfile                   none            swap    defaults,pri=10 0 0
          {% if is_uefi | bool %}/dev/{{ target_disk }}{{ p_suffix }}1               /boot/efi       vfat    defaults,noatime 0 2{% endif %}
        dest: "/mnt/target/etc/fstab"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "not ansible_check_mode"

    - name: "SYSTEM CONFIG | Generate crypttab map ledger to open hardware devices on boot sequence"
      ansible.builtin.copy:
        content: |
          # <target name> <source device> <key file> <options>
          {{ os_crypt_name }} {{ os_partition }} none luks,discard
          {% if has_vault | bool %}{{ vault_crypt_name }} UUID={{ vault_uuid_raw.stdout | default('CHECK_MODE_UUID_STUB') }} /etc/secure/vault.key luks,discard{% endif %}
        dest: "/mnt/target/etc/crypttab"
        owner: "root"
        group: "root"
        mode: "0440"
      when: "not ansible_check_mode"

    - name: Deploy custom encrypted storage layout administration wrapper binary to system paths
      ansible.builtin.copy:
        dest: "/mnt/target/usr/local/bin/vault"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          # Universal Vault Cryptographic Mount Manager
          VAULT_UUID="{{ vault_uuid_raw.stdout | default('CHECK_MODE_UUID_STUB') }}"
          MAPPER_NAME="{{ vault_crypt_name }}"
          MOUNT_POINT="/vault"
          KEY_FILE="/etc/secure/vault.key"
          
          if [[ $EUID -ne 0 ]]; then
             echo "[-] Error: This operation requires administrative privileges." >&2
             exit 1
          fi
          
          open_vault() {
              if [[ -b "/dev/mapper/${MAPPER_NAME}" ]]; then
                  echo "[!] Notification: Cryptographic mapper '${MAPPER_NAME}' is already active."
              else
                  cryptsetup open "UUID=${VAULT_UUID}" "${MAPPER_NAME}" --key-file "${KEY_FILE}"
              fi
          
              if mountpoint -q "${MOUNT_POINT}"; then
                  echo "[✔] Done: Vault is already mounted safely."
              else
                  mkdir -p "${MOUNT_POINT}"
                  mount -v "/dev/mapper/${MAPPER_NAME}" "${MOUNT_POINT}"
              fi
          }
          
          close_vault() {
              if mountpoint -q "${MOUNT_POINT}"; then
                  fuser -km "${MOUNT_POINT}" || true
                  sleep 0.5
                  umount -R -v "${MOUNT_POINT}"
              fi
          
              if [[ -b "/dev/mapper/${MAPPER_NAME}" ]]; then
                  cryptsetup luksClose "${MAPPER_NAME}"
              fi
          }
          
          case "${1:-}" in
              open) open_vault ;;
              close) close_vault ;;
              *) exit 2 ;;
          esac
        owner: "root"
        group: "root"
        mode: "0755"
      when: 
        - "not ansible_check_mode"
        - "has_vault | bool"
    # =========================================================================
    # PHASE 11: USER PROVISIONING & IDENTITY CONFIG
    # =========================================================================
    - name: Define chroot utility invocation macro strings based on platform distribution
      ansible.builtin.set_fact:
        chroot_cmd: "{{ 'arch-chroot /mnt/target' if ansible_facts['os_family'] == 'Archlinux' else 'chroot /mnt/target' }}"

    - name: Download firmware-dependent runtime boot loader modules and desktop environment components
      ansible.builtin.command: >
        {{ chroot_cmd }} {{
          'pacman -S --noconfirm grub networkmanager efibootmgr intel-ucode linux-headers linux-hardened-headers lightdm lightdm-gtk-greeter lightdm-gtk-greeter-settings firewalld bluez bluez-utils pipewire pipewire-pulse pipewire-alsa pipewire-jack xorg-server xfce4 xfce4-goodies' if ansible_facts['os_family'] == 'Archlinux' else
          'apt-get update && apt-get install -y linux-image-amd64 linux-headers-amd64 cryptsetup-initramfs grub-pc sudo lightdm firewalld bluez pipewire xserver-xorg xfce4' if (ansible_facts['os_family'] == 'Debian' and not is_uefi) else
          'apt-get update && apt-get install -y linux-image-amd64 linux-headers-amd64 cryptsetup-initramfs grub-efi-amd64 efibootmgr sudo lightdm firewalld bluez pipewire xserver-xorg xfce4' if (ansible_facts['os_family'] == 'Debian' and is_uefi) else
          'dnf install -y grub2-efi efibootmgr networkmanager sudo lightdm firewalld bluez pipewire-pulseaudio kernel-headers @xfce-desktop-environment' if (ansible_facts['os_family'] == 'RedHat') else 
          'zypper install -y grub2-x86_64-efi efibootmgr NetworkManager sudo lightdm firewalld bluez pipewire patterns-xfce-xfce'
        }}
      when: "not ansible_check_mode"

    - name: "USER | Set administrative user root password"
      ansible.builtin.shell: "echo 'root:{{ vault_root_password }}' | {{ chroot_cmd }} chpasswd"
      no_log: true
      when: "not ansible_check_mode"

    - name: "USER | Register primary regular deployment group"
      ansible.builtin.shell: "{{ chroot_cmd }} groupadd -g 1000 {{ target_username }} || true"
      when: "not ansible_check_mode"

    - name: "USER | Create primary account with native distribution privilege group"
      ansible.builtin.shell: >
        {{ chroot_cmd }} useradd -u 1000 -g 1000 -m 
        -G {{ admin_group }},audio,video,optical,storage 
        -s /bin/bash {{ target_username }} || true
      when: "not ansible_check_mode"

    - name: "USER | Commit primary regular user credential password"
      ansible.builtin.shell: "echo '{{ target_username }}:{{ vault_user_password }}' | {{ chroot_cmd }} chpasswd"
      no_log: true
      when: "not ansible_check_mode"

    - name: "VISUDO | Deploy clean drop-in privileges with absolute visudo syntax validation"
      ansible.builtin.copy:
        content: "{{ target_username }} ALL=(ALL:ALL) ALL"
        dest: "/mnt/target/etc/sudoers.d/{{ target_username }}"
        owner: "root"
        group: "root"
        mode: "0440"
        validate: "visudo -cf %s"
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 12: CRYPTO HOOKS & BOOT COMPILATION
    # =========================================================================
    - name: Generate the early userspace unlocking keyfile inside the encrypted container
      ansible.builtin.command: "dd bs=512 count=4 if=/dev/urandom of=/mnt/target/etc/secure/cryptroot.key"
      when: "not ansible_check_mode"

    - name: Lock early userspace unlock key file signatures strictly to root level privileges
      ansible.builtin.file:
        path: "/mnt/target/etc/secure/cryptroot.key"
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"

    - name: Inject early userspace unlock key block straight into main LUKS container keyslot
      ansible.builtin.shell: "echo '{{ os_passphrase }}' | cryptsetup luksAddKey --batch-mode {{ os_partition }} /mnt/target/etc/secure/cryptroot.key"
      no_log: true
      when: "not ansible_check_mode"

    - name: Inject early userspace keyfile array parameters into mkinitcpio configuration (Arch Linux)
      ansible.builtin.lineinfile:
        path: /mnt/target/etc/mkinitcpio.conf
        regexp: '^FILES='
        line: 'FILES=(/etc/secure/cryptroot.key)'
      when: 
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: Inject critical crypto modules and hooks into mkinitcpio configuration (Arch Linux)
      ansible.builtin.lineinfile:
        path: /mnt/target/etc/mkinitcpio.conf
        regexp: '^HOOKS='
        line: 'HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block encrypt btrfs filesystems fsck)'
      when: 
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: Inject early userspace keyfile extraction rules into Dracut profile trees (Fedora/openSUSE)
      ansible.builtin.copy:
        content: |
          install_items+="/etc/secure/cryptroot.key"
        dest: "/mnt/target/etc/dracut.conf.d/99-cryptroot.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      when: 
        - "ansible_facts['os_family'] in ['RedHat', 'Suse']"
        - "not ansible_check_mode"

    - name: Compile hardened initramfs boot images inside targeted runtime environment (Arch Linux)
      ansible.builtin.command: arch-chroot /mnt/target mkinitcpio -P
      when: 
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: Inject critical encryption parameters into core GRUB configurations
      ansible.builtin.lineinfile:
        path: /mnt/target/etc/default/grub
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?GRUB_ENABLE_CRYPTODISK=', line: 'GRUB_ENABLE_CRYPTODISK=y' }
        - { regexp: '^GRUB_CMDLINE_LINUX=', line: 'GRUB_CMDLINE_LINUX="cryptdevice={{ os_partition }}:{{ os_crypt_name }} root=/dev/mapper/{{ os_crypt_name }} rootfstype=btrfs rootflags=subvol=@ rw"' }
        - { regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=', line: 'GRUB_CMDLINE_LINUX_DEFAULT="loglevel=3 quiet lsm=landlock,lockdown,yama,apparmor,bpf"' }
      when: "not ansible_check_mode"

    - name: Deploy physical GRUB engine mapping blocks based on firmware mode
      ansible.builtin.command: "{{ chroot_cmd }} {{ 'grub-install --target=x86_64-efi --efi-directory=/boot --bootloader-id=GRUB --recheck' if is_uefi | bool else 'grub-install --target=i386-pc --recheck ' + target_disk }}"
      when: "not ansible_check_mode"

    - name: Compile final GRUB environment execution maps with snapshot recovery options
      ansible.builtin.command: "{{ chroot_cmd }} {{ 'grub-mkconfig -o /boot/grub/grub.cfg' if (ansible_facts['os_family'] == 'Archlinux' or ansible_facts['os_family'] == 'RedHat') else 'update-grub' }}"
      when: "not ansible_check_mode"

    - name: Actively enable system desktop services and bluetooth managers inside environment
      ansible.builtin.command: "{{ chroot_cmd }} systemctl enable {{ item }}"
      loop: [ 'NetworkManager', 'lightdm', 'bluetooth', 'firewalld', 'tuned', 'grub-btrfsd' ]
      failed_when: false
      when: "not ansible_check_mode"

    - name: Regenerate initramfs boot images with structural encryption hooks (Debian)
      ansible.builtin.command: chroot /mnt/target update-initramfs -u -k all
      when: 
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "CONNECTOR | Write active local deployment loop inventory for Stage 2 stacking"
      ansible.builtin.copy:
        content: |
          [hardened_nodes]
          localhost ansible_connection=local
        dest: "/mnt/target/home/{{ target_username }}/hosts.ini"
        owner: "1000"
        group: "1000"
        mode: "0644"
      when: "not ansible_check_mode"

